<svg viewBox="0 0 640 352" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="20" y="24" fill="var(--c)" font-size="13.5" font-weight="800">EC2版 — 登場人物が2人増える</text>
  <text x="332" y="24" fill="var(--new)" font-size="13.5" font-weight="800">Fargate版 — サーバーが出てこない</text>

  <!-- EC2側 -->
  <rect x="14" y="36" width="300" height="184" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="1.6"/>
  <text x="28" y="60" fill="var(--fg)" font-size="12.5" font-weight="800">EC2インスタンス</text>
  <text x="28" y="78" fill="var(--sub)" font-size="11">＝ コンテナインスタンス（保守は自分）</text>

  <rect x="28" y="88" width="272" height="28" rx="6" fill="var(--bg)"/>
  <text x="42" y="107" fill="var(--fg)" font-size="11.5">ECSコンテナエージェント</text>

  <rect x="28" y="124" width="130" height="42" rx="6" fill="var(--bg)"/>
  <text x="42" y="141" fill="var(--fg)" font-size="11.5" font-weight="700">コンテナ</text>
  <text x="42" y="159" fill="var(--sub)" font-size="10.5">EC2のIPを共有</text>

  <rect x="170" y="124" width="130" height="42" rx="6" fill="var(--bg)"/>
  <text x="184" y="141" fill="var(--fg)" font-size="11.5" font-weight="700">コンテナ</text>
  <text x="184" y="159" fill="var(--sub)" font-size="10.5">EC2のIPを共有</text>

  <text x="28" y="190" fill="var(--fg)" font-size="11.5">networkMode: Linuxの既定は bridge</text>
  <text x="28" y="208" fill="var(--c)" font-size="11.5" font-weight="700">同じEC2を共有。IPは1つ</text>

  <rect x="14" y="234" width="300" height="62" rx="10" fill="var(--track)"/>
  <text x="28" y="258" fill="var(--sub)" font-size="11.5">ALBのターゲットタイプ</text>
  <text x="28" y="280" fill="var(--sub)" font-size="11.5" font-weight="700">この記事では未確認</text>

  <!-- Fargate側 -->
  <rect x="326" y="36" width="300" height="184" rx="10" fill="none" stroke="var(--new)" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="340" y="60" fill="var(--new)" font-size="12.5" font-weight="800">サーバーの箱が無い</text>
  <text x="340" y="78" fill="var(--sub)" font-size="11">CPUとメモリを書くだけ（AWSが用意）</text>

  <rect x="340" y="96" width="132" height="70" rx="6" fill="var(--track)"/>
  <text x="354" y="118" fill="var(--fg)" font-size="11.5" font-weight="700">タスク</text>
  <text x="354" y="138" fill="var(--sub)" font-size="11">ENI を1本持つ</text>
  <text x="354" y="157" fill="var(--fg)" font-size="11">10.0.1.23:80</text>

  <rect x="482" y="96" width="132" height="70" rx="6" fill="var(--track)"/>
  <text x="496" y="118" fill="var(--fg)" font-size="11.5" font-weight="700">タスク</text>
  <text x="496" y="138" fill="var(--sub)" font-size="11">ENI を1本持つ</text>
  <text x="496" y="157" fill="var(--fg)" font-size="11">10.0.2.41:80</text>

  <text x="340" y="190" fill="var(--fg)" font-size="11.5">networkMode: awsvpc 固定</text>
  <text x="340" y="208" fill="var(--new)" font-size="11.5" font-weight="700">タスクごとに独立。IPが別</text>

  <rect x="326" y="234" width="300" height="62" rx="10" fill="var(--track)"/>
  <text x="340" y="258" fill="var(--sub)" font-size="11.5">ALBのターゲットタイプ</text>
  <text x="340" y="280" fill="var(--new)" font-size="11.5" font-weight="700">ip 必須（公式明記・後で変更不可）</text>

  <text x="320" y="330" fill="var(--sub)" font-size="12.5" font-weight="700" text-anchor="middle">差はサーバーの有無だけではない。IPの持ち方が変わる</text>
</svg>
