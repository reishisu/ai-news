<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- axes -->
  <line x1="50" y1="20" x2="50" y2="190" stroke="var(--sub)" stroke-width="1"/>
  <line x1="50" y1="190" x2="600" y2="190" stroke="var(--sub)" stroke-width="1"/>
  <text x="14" y="24" fill="var(--sub)" font-size="11.5">達成率</text>
  <text x="600" y="210" fill="var(--sub)" font-size="11.5" text-anchor="end">同時に満たす条件の数</text>

  <!-- 50% guide -->
  <line x1="50" y1="105" x2="600" y2="105" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="596" y="100" fill="var(--sub)" font-size="11" text-anchor="end">50%</text>

  <!-- bars: k=1,3,5,7,8,10,12 -->
  <!-- x positions spaced -->
  <g font-size="11.5" fill="var(--fg)" text-anchor="middle">
    <rect x="60" y="34" width="52" height="156" rx="4" fill="var(--new)"/>
    <text x="86" y="30" fill="var(--fg)" font-weight="800">k=1</text>

    <rect x="140" y="70" width="52" height="120" rx="4" fill="var(--new)"/>
    <text x="166" y="66" fill="var(--fg)" font-weight="800">k=3</text>

    <rect x="220" y="98" width="52" height="92" rx="4" fill="var(--old)"/>
    <text x="246" y="94" fill="var(--fg)" font-weight="800">k=5</text>

    <rect x="300" y="150" width="52" height="40" rx="4" fill="var(--c)"/>
    <text x="326" y="146" fill="var(--fg)" font-weight="800">k=7</text>

    <rect x="380" y="162" width="52" height="28" rx="4" fill="var(--c)"/>
    <text x="406" y="158" fill="var(--fg)" font-weight="800">k=8</text>
    <text x="406" y="176" fill="#ffffff" font-size="10.5" font-weight="800">5.7%</text>

    <rect x="460" y="176" width="52" height="14" rx="4" fill="var(--c)"/>
    <text x="486" y="172" fill="var(--fg)" font-weight="800">k=10</text>

    <rect x="540" y="182" width="52" height="8" rx="3" fill="var(--c)"/>
    <text x="566" y="178" fill="var(--fg)" font-weight="800">k=12</text>
  </g>
</svg>
