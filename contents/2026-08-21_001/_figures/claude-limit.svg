<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="sans-serif">
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--fg)">週次利用上限「+50%増」はいつまで有効か</text>

  <!-- 期間バー -->
  <rect x="70" y="70" width="360" height="46" rx="6" fill="var(--new)"/>
  <text x="250" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">+50% 増（いま有効）</text>

  <!-- 未定の期間(ハッチ風の薄いバー) -->
  <rect x="430" y="70" width="150" height="46" rx="6" fill="var(--track)" stroke="var(--old)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="505" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--sub)">未定</text>

  <!-- 境界の縦線 8/31 -->
  <line x1="430" y1="58" x2="430" y2="150" stroke="var(--c)" stroke-width="3"/>
  <circle cx="430" cy="70" r="6" fill="var(--c)"/>

  <!-- ラベル -->
  <text x="70" y="140" font-size="13" fill="var(--sub)">5月13日〜（報道）</text>
  <text x="430" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--c)">8月31日</text>
  <text x="580" y="140" text-anchor="end" font-size="13" fill="var(--sub)">9月1日〜</text>

  <!-- 注記 -->
  <text x="320" y="192" text-anchor="middle" font-size="14" fill="var(--fg)">対象: Pro / Max / Team / Enterprise の「週次」上限</text>
  <text x="320" y="216" text-anchor="middle" font-size="13" fill="var(--sub)">恒久化を目指すが「需要が強く容量が逼迫しうる」（8/18告知の原文）</text>
  <text x="320" y="240" text-anchor="middle" font-size="13" fill="var(--sub)">9月1日以降は元の上限へ戻る可能性がある（未確定）</text>

  <text x="320" y="278" text-anchor="middle" font-size="12" fill="var(--sub)">出典: @ClaudeDevs 2026年8月18日の投稿。開始日(5/13)は報道ベース</text>
</svg>
