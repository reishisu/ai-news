<svg viewBox="0 0 640 230" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 目盛り: 0日=200px, 5日=600px (1日=80px) -->
  <line x1="200" y1="30" x2="200" y2="196" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="560" y1="30" x2="560" y2="196" stroke="var(--sub)" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="560" y="24" fill="var(--sub)" font-size="11.5" text-anchor="middle">4.5日</text>

  <!-- 行1 -->
  <text x="14" y="60" fill="var(--fg)" font-size="12.5" font-weight="700">そのまま</text>
  <rect x="200" y="42" width="400" height="30" rx="6" fill="var(--track)"/>
  <rect x="200" y="42" width="360" height="30" rx="6" fill="var(--new)"/>
  <text x="380" y="62" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">4.5日</text>

  <!-- 行2 -->
  <text x="14" y="112" fill="var(--fg)" font-size="12.5" font-weight="700">一番大きい D を</text>
  <text x="14" y="130" fill="var(--fg)" font-size="12.5" font-weight="700">2.0日 → 1.0日</text>
  <rect x="200" y="104" width="400" height="30" rx="6" fill="var(--track)"/>
  <rect x="200" y="104" width="360" height="30" rx="6" fill="var(--old)"/>
  <text x="380" y="124" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle">4.5日</text>
  <text x="380" y="152" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">1日も縮まない</text>

  <!-- 行3 -->
  <text x="14" y="186" fill="var(--fg)" font-size="12.5" font-weight="700">全余裕ゼロの E を</text>
  <text x="14" y="204" fill="var(--fg)" font-size="12.5" font-weight="700">1.5日 → 0.5日</text>
  <rect x="200" y="178" width="400" height="30" rx="6" fill="var(--track)"/>
  <rect x="200" y="178" width="320" height="30" rx="6" fill="var(--a)"/>
  <text x="360" y="198" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">4.0日</text>
  <text x="600" y="198" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="end">縮んだ</text>
</svg>
