<svg viewBox="0 0 640 326" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="mSub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
    <marker id="mA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--a)"/>
    </marker>
    <marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
  </defs>

  <!-- 契約 -->
  <rect x="210" y="14" width="220" height="54" rx="10" fill="var(--track)" stroke="var(--new)" stroke-width="2"/>
  <text x="320" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="var(--fg)">契約 schema.json</text>
  <text x="320" y="53" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--sub)">"score": required</text>

  <path d="M255 70 C 220 84, 190 88, 168 94" fill="none" stroke="var(--sub)" stroke-width="1.6" marker-end="url(#mSub)"/>
  <path d="M385 70 C 420 84, 450 88, 472 94" fill="none" stroke="var(--sub)" stroke-width="1.6" marker-end="url(#mSub)"/>
  <text x="230" y="86" text-anchor="middle" font-size="10.5" fill="var(--sub)">照合</text>
  <text x="410" y="86" text-anchor="middle" font-size="10.5" fill="var(--sub)">照合</text>

  <!-- provider v1 -->
  <rect x="20" y="98" width="280" height="132" rx="10" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="160" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="var(--fg)">provider v1</text>
  <text x="160" y="138" text-anchor="middle" font-size="11" fill="var(--sub)">契約どおり</text>
  <text x="40" y="160" font-size="12" font-family="ui-monospace, monospace" fill="var(--fg)">"id": 1,</text>
  <text x="40" y="178" font-size="12" font-family="ui-monospace, monospace" fill="var(--fg)">"title": "...",</text>
  <text x="40" y="196" font-size="12" font-weight="700" font-family="ui-monospace, monospace" fill="var(--a)">"score": 0.92</text>

  <!-- provider v2 -->
  <rect x="340" y="98" width="280" height="132" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="480" y="122" text-anchor="middle" font-size="13" font-weight="800" fill="var(--c)">provider v2（破壊的変更）</text>
  <text x="480" y="138" text-anchor="middle" font-size="11" fill="var(--sub)">内部の見直しのつもり</text>
  <text x="360" y="160" font-size="12" font-family="ui-monospace, monospace" fill="var(--fg)">"id": 1,</text>
  <text x="360" y="178" font-size="12" font-family="ui-monospace, monospace" fill="var(--fg)">"title": "...",</text>
  <text x="360" y="200" font-size="11.5" font-family="ui-monospace, monospace">
    <tspan fill="var(--sub)" text-decoration="line-through">"score"</tspan>
    <tspan dx="6" fill="var(--fg)">→</tspan>
    <tspan dx="6" fill="var(--c)" font-weight="800">"relevance_score"</tspan>
  </text>

  <!-- 判定への矢印 -->
  <path d="M160 230 L160 254" stroke="var(--a)" stroke-width="2" marker-end="url(#mA)"/>
  <path d="M480 230 L480 254" stroke="var(--c)" stroke-width="2" marker-end="url(#mC)"/>

  <!-- OK -->
  <rect x="95" y="258" width="130" height="38" rx="8" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="160" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="var(--a)">[OK] 契約テスト</text>
  <text x="160" y="312" text-anchor="middle" font-size="11" fill="var(--sub)">全フィールドが契約と一致</text>

  <!-- NG -->
  <rect x="415" y="258" width="130" height="38" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="480" y="282" text-anchor="middle" font-size="13" font-weight="800" fill="var(--c)">[NG] 契約テスト</text>
  <text x="480" y="312" text-anchor="middle" font-size="11" font-family="ui-monospace, monospace" fill="var(--c)">'score' is a required property</text>
</svg>
