<svg viewBox="0 0 640 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="mNew" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--new)"/>
    </marker>
    <marker id="mC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
  </defs>

  <!-- 失敗ループ（恒久化） -->
  <path d="M272 80 C 272 42, 168 42, 168 30 C 168 42, 64 42, 64 80"
        fill="none" stroke="var(--c)" stroke-width="2" marker-end="url(#mC)"/>
  <text x="168" y="16" text-anchor="middle" font-size="11" font-weight="800" fill="var(--c)">終了条件がないと</text>
  <text x="168" y="30" text-anchor="middle" font-size="11" font-weight="800" fill="var(--c)">恒久化する（合同チーム化）</text>

  <!-- 移行点の破線 -->
  <line x1="320" y1="80" x2="320" y2="230" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="320" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="var(--sub)">境界と契約が決まる</text>

  <!-- Collaboration -->
  <rect x="20" y="80" width="280" height="150" rx="10" fill="var(--track)" stroke="var(--new)" stroke-width="2"/>
  <text x="160" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="var(--new)">Collaboration</text>
  <rect x="120" y="118" width="80" height="20" rx="10" fill="var(--new)"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">期限付き</text>
  <text x="160" y="160" text-anchor="middle" font-size="12" fill="var(--fg)">境界とインターフェースを</text>
  <text x="160" y="178" text-anchor="middle" font-size="12" fill="var(--fg)">契約(schema/pact)にする</text>
  <text x="160" y="206" text-anchor="middle" font-size="11" fill="var(--sub)">終了条件:</text>
  <text x="160" y="221" text-anchor="middle" font-size="11" fill="var(--sub)">契約がCIで検証されている</text>

  <!-- 前進の矢印 -->
  <path d="M304 155 L336 155" stroke="var(--new)" stroke-width="2.5" marker-end="url(#mNew)"/>

  <!-- X-as-a-Service -->
  <rect x="340" y="80" width="280" height="150" rx="10" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="480" y="108" text-anchor="middle" font-size="15" font-weight="800" fill="var(--fg)">X-as-a-Service</text>
  <rect x="418" y="118" width="124" height="20" rx="10" fill="none" stroke="var(--sub)" stroke-width="1"/>
  <text x="480" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="var(--sub)">低コストで運用</text>
  <text x="480" y="160" text-anchor="middle" font-size="12" fill="var(--fg)">providerが提供し</text>
  <text x="480" y="178" text-anchor="middle" font-size="12" fill="var(--fg)">consumerが消費するだけ</text>
  <text x="480" y="206" text-anchor="middle" font-size="11" fill="var(--sub)">運用:</text>
  <text x="480" y="221" text-anchor="middle" font-size="11" fill="var(--sub)">変更依頼シート経由でのみ変更</text>

  <text x="320" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fg)">「決める」は終わらせる。「使う」は延々と続く — 混ぜない</text>
</svg>
