<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <text x="8" y="22" font-size="15" font-weight="700" fill="var(--fg)">決定的な情報を1体だけが持つ課題の正答率</text>
  <text x="8" y="58" font-size="13" fill="var(--sub)">1体に全情報</text>
  <rect x="160" y="44" width="400" height="22" rx="5" fill="var(--track)"/>
  <rect x="160" y="44" width="400" height="22" rx="5" fill="var(--new)"/>
  <text x="550" y="60" font-size="14" font-weight="700" text-anchor="end" fill="#fff">ほぼ100%</text>
  <text x="8" y="102" font-size="13" fill="var(--sub)">4体で議論</text>
  <rect x="160" y="88" width="400" height="22" rx="5" fill="var(--track)"/>
  <rect x="160" y="88" width="68" height="22" rx="5" fill="var(--old)"/>
  <rect x="228" y="88" width="76" height="22" fill="var(--old)" opacity="0.45"/>
  <text x="314" y="104" font-size="14" font-weight="700" fill="var(--fg)">17〜36%</text>
  <text x="8" y="146" font-size="12.5" fill="var(--sub)">集団にすると、すでに共有された話に流されて少数派の情報を拾えない</text>
</svg>
