<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="14" y="24" fill="var(--fg)" font-size="13.5" font-weight="800">Unity Web でのスレッドの扱い</text>

  <!-- C# -->
  <rect x="14" y="44" width="300" height="72" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="164" y="70" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">C#（マネージド）のスレッド</text>
  <text x="164" y="93" fill="var(--c)" font-size="13" font-weight="800" text-anchor="middle">使えない</text>
  <text x="164" y="110" fill="var(--sub)" font-size="11.5" text-anchor="middle">1本のC#スレッドで動かすしかない</text>

  <!-- C/C++ -->
  <rect x="326" y="44" width="300" height="72" rx="10" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="476" y="70" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">C / C++（ネイティブ）のスレッド</text>
  <text x="476" y="93" fill="var(--a)" font-size="13" font-weight="800" text-anchor="middle">条件つきで使える</text>
  <text x="476" y="110" fill="var(--sub)" font-size="11.5" text-anchor="middle">実験的な設定＋サーバーのヘッダーが必要</text>

  <!-- 下段: 理由 -->
  <rect x="14" y="134" width="612" height="44" rx="9" fill="var(--track)"/>
  <text x="320" y="161" fill="var(--fg)" font-size="12.5" text-anchor="middle">理由: WebAssemblyにマルチスレッド対応のガベージコレクションが無い（Unity公式）</text>

  <text x="320" y="204" fill="var(--sub)" font-size="12.5" text-anchor="middle">重い処理を別スレッドへ、という発想がそのままでは通らない</text>
</svg>
