<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="sans-serif">
  <text x="320" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--fg)">in:1,2,3 に対する判定の変化</text>

  <!-- ヘッダ行 -->
  <text x="150" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--sub)">入力値</text>
  <text x="360" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--old)">従来(緩い比較)</text>
  <text x="540" y="70" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--new)">12.67.0 / 13.26.0</text>
  <line x1="40" y1="82" x2="600" y2="82" stroke="var(--track)" stroke-width="2"/>

  <!-- 行: '1' -->
  <text x="150" y="112" text-anchor="middle" font-size="15" fill="var(--fg)" font-family="monospace">'1'</text>
  <text x="360" y="112" text-anchor="middle" font-size="15" fill="var(--new)" font-weight="bold">通る</text>
  <text x="540" y="112" text-anchor="middle" font-size="15" fill="var(--new)" font-weight="bold">通る</text>
  <line x1="40" y1="126" x2="600" y2="126" stroke="var(--track)" stroke-width="1"/>

  <!-- 行: '01' -->
  <text x="150" y="156" text-anchor="middle" font-size="15" fill="var(--fg)" font-family="monospace">'01'</text>
  <text x="360" y="156" text-anchor="middle" font-size="15" fill="var(--old)" font-weight="bold">通る(バイパス)</text>
  <text x="540" y="156" text-anchor="middle" font-size="15" fill="var(--fg)" font-weight="bold">拒否</text>
  <line x1="40" y1="170" x2="600" y2="170" stroke="var(--track)" stroke-width="1"/>

  <!-- 行: ' 1' -->
  <text x="150" y="200" text-anchor="middle" font-size="15" fill="var(--fg)" font-family="monospace">' 1'  '1 '</text>
  <text x="360" y="200" text-anchor="middle" font-size="15" fill="var(--old)" font-weight="bold">通る(バイパス)</text>
  <text x="540" y="200" text-anchor="middle" font-size="15" fill="var(--fg)" font-weight="bold">拒否</text>
  <line x1="40" y1="214" x2="600" y2="214" stroke="var(--track)" stroke-width="1"/>

  <!-- 行: '1.0' -->
  <text x="150" y="244" text-anchor="middle" font-size="15" fill="var(--fg)" font-family="monospace">'1.0'  '1e0'  '+1'</text>
  <text x="360" y="244" text-anchor="middle" font-size="15" fill="var(--old)" font-weight="bold">通る(バイパス)</text>
  <text x="540" y="244" text-anchor="middle" font-size="15" fill="var(--fg)" font-weight="bold">拒否</text>
  <line x1="40" y1="258" x2="600" y2="258" stroke="var(--track)" stroke-width="1"/>

  <text x="320" y="300" text-anchor="middle" font-size="13" fill="var(--sub)">in_array() に strict=true が付いた(PR #61146)。'1'だけが一致になる</text>
</svg>
