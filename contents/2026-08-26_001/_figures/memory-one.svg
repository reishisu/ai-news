<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 272" font-family="'Noto Sans JP','IPAGothic',sans-serif">
  <text x="230" y="28" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--fg)">記憶の置き場所が1つになった</text>

  <!-- ============ 8月24日まで ============ -->
  <text x="14" y="60" font-size="17" font-weight="bold" fill="var(--sub)">8月24日まで</text>

  <rect x="14" y="70" width="118" height="46" rx="10" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="73" y="100" text-anchor="middle" font-size="20" fill="var(--fg)">チャット</text>

  <rect x="164" y="70" width="132" height="46" rx="10" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="230" y="100" text-anchor="middle" font-size="20" fill="var(--fg)">記憶</text>

  <rect x="328" y="70" width="118" height="46" rx="10" fill="none" stroke="var(--sub)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="387" y="100" text-anchor="middle" font-size="20" fill="var(--sub)">Cowork</text>

  <!-- つながっている側 -->
  <line x1="132" y1="93" x2="164" y2="93" stroke="var(--sub)" stroke-width="3"/>
  <!-- 切れている側: 破線の上に✕ -->
  <line x1="296" y1="93" x2="328" y2="93" stroke="var(--c)" stroke-width="2.5" stroke-dasharray="5 4"/>
  <circle cx="312" cy="93" r="11" fill="var(--bg)"/>
  <line x1="306" y1="87" x2="318" y2="99" stroke="var(--c)" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="318" y1="87" x2="306" y2="99" stroke="var(--c)" stroke-width="3.5" stroke-linecap="round"/>

  <text x="387" y="134" text-anchor="middle" font-size="16" fill="var(--c)">記憶なし</text>

  <!-- ============ 変化 ============ -->
  <line x1="14" y1="149" x2="206" y2="149" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="254" y1="149" x2="446" y2="149" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="230" y1="138" x2="230" y2="160" stroke="var(--new)" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="152" x2="230" y2="160" stroke="var(--new)" stroke-width="3" stroke-linecap="round"/>
  <line x1="238" y1="152" x2="230" y2="160" stroke="var(--new)" stroke-width="3" stroke-linecap="round"/>

  <!-- ============ 8月25日から ============ -->
  <text x="14" y="176" font-size="17" font-weight="bold" fill="var(--new)">8月25日から</text>

  <rect x="14" y="190" width="118" height="46" rx="10" fill="var(--track)" stroke="var(--new)" stroke-width="2.5"/>
  <text x="73" y="220" text-anchor="middle" font-size="20" fill="var(--fg)">チャット</text>

  <rect x="328" y="190" width="118" height="46" rx="10" fill="var(--track)" stroke="var(--new)" stroke-width="2.5"/>
  <text x="387" y="220" text-anchor="middle" font-size="20" fill="var(--fg)">Cowork</text>

  <line x1="132" y1="213" x2="164" y2="213" stroke="var(--new)" stroke-width="3.5"/>
  <line x1="296" y1="213" x2="328" y2="213" stroke="var(--new)" stroke-width="3.5"/>

  <!-- 主役だけ塗りつぶす -->
  <rect x="164" y="184" width="132" height="58" rx="11" fill="var(--new)"/>
  <text x="230" y="208" text-anchor="middle" font-size="23" font-weight="bold" fill="var(--bg)">1つの記憶</text>
  <text x="230" y="230" text-anchor="middle" font-size="16" fill="var(--bg)">Topics</text>

  <text x="230" y="262" text-anchor="middle" font-size="16" fill="var(--sub)">どちらで話しても、ここに1つだけ残る</text>
</svg>
