<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 分岐点 -->
  <rect x="130" y="10" width="340" height="54" rx="10" fill="var(--track)" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="300" y="32" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">lock のバージョンが</text>
  <text x="300" y="51" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">package.json の範囲を満たすか?</text>

  <path d="M300 64 L300 82" stroke="var(--sub)" stroke-width="1.8"/>
  <path d="M150 82 L450 82" stroke="var(--sub)" stroke-width="1.8"/>
  <path d="M150 82 L150 104" stroke="var(--a)" stroke-width="1.8" marker-end="url(#arA)"/>
  <path d="M450 82 L450 104" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <text x="160" y="76" fill="var(--a)" font-size="12.5" font-weight="800">満たす</text>
  <text x="440" y="76" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="end">満たさない</text>

  <!-- 左: 満たす -->
  <rect x="14" y="108" width="272" height="146" rx="10" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="150" y="136" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle">npm install も npm ci も</text>
  <text x="150" y="160" fill="var(--fg)" font-size="13" text-anchor="middle">lock の版をそのまま使う</text>
  <text x="150" y="194" fill="var(--a)" font-size="15" font-weight="800" text-anchor="middle">同じ結果になる</text>
  <text x="150" y="224" fill="var(--sub)" font-size="11.5" text-anchor="middle">実測: 4.1.2 公開後も 4.0.0</text>
  <text x="150" y="242" fill="var(--sub)" font-size="11.5" text-anchor="middle">lock は1バイトも変わらない</text>

  <!-- 右上: install -->
  <rect x="314" y="108" width="272" height="68" rx="10" fill="none" stroke="var(--b)" stroke-width="2"/>
  <text x="450" y="134" fill="var(--b)" font-size="13.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">npm install</text>
  <text x="450" y="158" fill="var(--fg)" font-size="12.5" text-anchor="middle">lock を書き換え、4.1.2 が入る</text>

  <!-- 右下: ci -->
  <rect x="314" y="186" width="272" height="68" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="450" y="212" fill="var(--c)" font-size="13.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">npm ci</text>
  <text x="450" y="236" fill="var(--fg)" font-size="12.5" text-anchor="middle">EUSAGE で落ちる。何も入れない</text>

  <text x="300" y="282" fill="var(--sub)" font-size="12.5" text-anchor="middle">差は「どちらを見るか」ではなく、ズレたときに直すか落ちるか</text>

  <defs>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--a)"/>
    </marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
  </defs>
</svg>
