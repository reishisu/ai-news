<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 見出し -->
  <text x="144" y="22" fill="var(--a)" font-size="14" font-weight="800" text-anchor="middle">lock が固定する</text>
  <rect x="12" y="30" width="264" height="2" fill="var(--a)"/>
  <text x="416" y="22" fill="var(--c)" font-size="14" font-weight="800" text-anchor="middle">lock が固定しない</text>
  <rect x="284" y="30" width="264" height="2" fill="var(--c)"/>

  <!-- 左列 -->
  <rect x="12" y="42" width="264" height="72" rx="8" fill="var(--track)"/>
  <text x="144" y="72" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">依存ツリーの形とバージョン</text>
  <text x="144" y="98" fill="var(--sub)" font-size="12" text-anchor="middle">6年前のlockを今日ci → 1行も同じ</text>

  <rect x="12" y="126" width="264" height="72" rx="8" fill="var(--track)"/>
  <text x="144" y="156" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">tarball の中身（sha512）</text>
  <text x="144" y="182" fill="var(--sub)" font-size="12" text-anchor="middle">すり替えたら EINTEGRITY</text>

  <rect x="12" y="210" width="264" height="72" rx="8" fill="var(--track)"/>
  <text x="144" y="240" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">スクリプトを持つという事実</text>
  <text x="144" y="266" fill="var(--sub)" font-size="12" text-anchor="middle">lock に hasInstallScript: true</text>

  <!-- 右列 -->
  <rect x="284" y="42" width="264" height="52" rx="8" fill="none" stroke="var(--c)" stroke-width="1.5"/>
  <text x="416" y="64" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">取得元のレジストリ</text>
  <text x="416" y="84" fill="var(--sub)" font-size="12" text-anchor="middle">127.0.0.1 から7個。警告0</text>

  <rect x="284" y="104" width="264" height="52" rx="8" fill="none" stroke="var(--c)" stroke-width="1.5"/>
  <text x="416" y="126" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">スクリプトが走るか</text>
  <text x="416" y="146" fill="var(--sub)" font-size="12" text-anchor="middle">npm10:実行 / npm12:ブロック</text>

  <rect x="284" y="166" width="264" height="52" rx="8" fill="none" stroke="var(--c)" stroke-width="1.5"/>
  <text x="416" y="188" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">lock を作ったフラグ</text>
  <text x="416" y="208" fill="var(--sub)" font-size="12" text-anchor="middle">フラグ無しciは ETARGET</text>

  <rect x="284" y="228" width="264" height="52" rx="8" fill="none" stroke="var(--c)" stroke-width="1.5"/>
  <text x="416" y="250" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">npm 自身のバージョン</text>
  <text x="416" y="270" fill="var(--sub)" font-size="12" text-anchor="middle">npm12 は shrinkwrap を無視</text>

  <text x="280" y="306" fill="var(--sub)" font-size="12" text-anchor="middle">右の4つは、lockを1文字も変えずに結果が変わった</text>
</svg>
