<svg viewBox="0 0 560 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 見出し -->
  <text x="144" y="22" fill="var(--a)" font-size="13.5" font-weight="800" text-anchor="middle">A を範囲で書く</text>
  <rect x="12" y="30" width="264" height="2" fill="var(--a)"/>
  <text x="416" y="22" fill="var(--c)" font-size="13.5" font-weight="800" text-anchor="middle">A を古い版に固定する</text>
  <rect x="284" y="30" width="264" height="2" fill="var(--c)"/>

  <!-- 左: app -->
  <rect x="96" y="44" width="96" height="30" rx="7" fill="var(--track)"/>
  <text x="144" y="64" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">自分のアプリ</text>
  <path d="M144 74 L86 106" stroke="var(--sub)" stroke-width="1.5"/>
  <path d="M144 74 L202 106" stroke="var(--sub)" stroke-width="1.5"/>

  <!-- 左: A / B -->
  <rect x="32" y="106" width="108" height="28" rx="7" fill="var(--track)"/>
  <text x="86" y="125" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">A（新しい版）</text>
  <rect x="160" y="106" width="84" height="28" rx="7" fill="var(--track)"/>
  <text x="202" y="125" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">B</text>

  <path d="M86 134 L134 174" stroke="var(--sub)" stroke-width="1.5"/>
  <path d="M202 134 L154 174" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="52" y="158" fill="var(--sub)" font-size="11">lib ^2</text>
  <text x="212" y="158" fill="var(--sub)" font-size="11">lib ^2</text>

  <!-- 左: lib -->
  <rect x="96" y="174" width="96" height="28" rx="7" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="144" y="193" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">lib 2.1（1つ）</text>

  <text x="144" y="228" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">要求が重なる → まとめられる</text>
  <text x="144" y="248" fill="var(--sub)" font-size="11.5" text-anchor="middle">入る依存は3つ</text>

  <!-- 右: app -->
  <rect x="368" y="44" width="96" height="30" rx="7" fill="var(--track)"/>
  <text x="416" y="64" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">自分のアプリ</text>
  <path d="M416 74 L358 106" stroke="var(--sub)" stroke-width="1.5"/>
  <path d="M416 74 L474 106" stroke="var(--sub)" stroke-width="1.5"/>

  <!-- 右: A / B -->
  <rect x="302" y="106" width="112" height="28" rx="7" fill="var(--track)" stroke="var(--c)" stroke-width="1.5"/>
  <text x="358" y="125" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">A 1.0.0 に固定</text>
  <rect x="432" y="106" width="84" height="28" rx="7" fill="var(--track)"/>
  <text x="474" y="125" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">B</text>

  <path d="M358 134 L358 174" stroke="var(--sub)" stroke-width="1.5"/>
  <path d="M474 134 L474 174" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="300" y="158" fill="var(--sub)" font-size="11">lib ^1</text>
  <text x="484" y="158" fill="var(--sub)" font-size="11">lib ^2</text>

  <!-- 右: lib 2つ -->
  <rect x="306" y="174" width="104" height="28" rx="7" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="358" y="193" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">lib 1.9</text>
  <rect x="422" y="174" width="104" height="28" rx="7" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="474" y="193" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">lib 2.1</text>

  <text x="416" y="228" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">要求が食い違う → 2つ入る</text>
  <text x="416" y="248" fill="var(--sub)" font-size="11.5" text-anchor="middle">入る依存は4つ。上がりうる先も増える</text>

  <text x="280" y="284" fill="var(--sub)" font-size="12" text-anchor="middle">論文5.1節の説明を図にしたもの。実測ではありません。</text>
</svg>
