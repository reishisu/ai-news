<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--fg)">Chrome 151 の修正は3つの入れ物に届く。告知が出るのは2つだけ</text>

  <!-- 上流 -->
  <rect x="200" y="52" width="240" height="42" rx="8" fill="var(--new)"/>
  <text x="320" y="79" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Chromium 151.0.7922.173</text>

  <!-- 分岐線 -->
  <path d="M320 94 L320 112" stroke="var(--sub)" stroke-width="2" fill="none"/>
  <path d="M110 130 L110 112 L530 112 L530 130" stroke="var(--sub)" stroke-width="2" fill="none"/>
  <path d="M320 112 L320 130" stroke="var(--sub)" stroke-width="2" fill="none"/>

  <!-- 3つの箱 -->
  <rect x="20" y="130" width="180" height="96" rx="8" fill="var(--track)" stroke="var(--b)" stroke-width="2"/>
  <text x="110" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--fg)">Chrome デスクトップ</text>
  <text x="110" y="176" text-anchor="middle" font-size="12" fill="var(--sub)">151.0.7922.173/.174</text>
  <text x="110" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--b)">告知あり（8/21 5:22）</text>
  <text x="110" y="218" text-anchor="middle" font-size="12" fill="var(--sub)">CVE 7件を列挙</text>

  <rect x="230" y="130" width="180" height="96" rx="8" fill="var(--track)" stroke="var(--b)" stroke-width="2"/>
  <text x="320" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--fg)">Chrome for Android</text>
  <text x="320" y="176" text-anchor="middle" font-size="12" fill="var(--sub)">151.0.7922.173</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--b)">告知あり（8/21 7:00）</text>
  <text x="320" y="218" text-anchor="middle" font-size="12" fill="var(--sub)">「同じ修正が入る」と明記</text>

  <rect x="440" y="130" width="180" height="96" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="530" y="154" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--fg)">Android System</text>
  <text x="530" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--fg)">WebView</text>
  <text x="530" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="var(--c)">告知なし</text>
  <text x="530" y="216" text-anchor="middle" font-size="12" fill="var(--sub)">最後の専用告知は2015年</text>

  <!-- 更新経路 -->
  <text x="110" y="256" text-anchor="middle" font-size="12" fill="var(--sub)">自動更新</text>
  <text x="320" y="256" text-anchor="middle" font-size="12" fill="var(--sub)">Google Play</text>
  <text x="530" y="256" text-anchor="middle" font-size="12" fill="var(--sub)">Google Play（別アプリ）</text>

  <!-- 結論 -->
  <rect x="20" y="278" width="600" height="46" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="320" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="var(--fg)">WebView に依存するアプリは、Chrome を更新しても直らない</text>
  <text x="320" y="317" text-anchor="middle" font-size="12" fill="var(--sub)">Play ストアで「Android System WebView」を別に更新する必要がある</text>

  <text x="320" y="348" text-anchor="middle" font-size="11" fill="var(--sub)">出典: Chrome Releases 2026/8/20 の2本。WebView の告知が出ていないことは筆者がラベル別フィードで確認</text>
</svg>
