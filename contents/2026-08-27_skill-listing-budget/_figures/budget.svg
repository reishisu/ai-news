  <text x="266" y="121" font-size="16" fill="var(--bg)">説明</text>

  <rect x="10" y="146" width="208" height="66" rx="10" fill="var(--track)"/>
  <text x="24" y="172" font-size="19" font-weight="bold" fill="var(--fg)">たまに使う</text>
  <rect x="24" y="182" width="180" height="22" rx="6" fill="var(--sub)"/>
  <text x="34" y="199" font-size="16" fill="var(--bg)">説明</text>
  <rect x="242" y="146" width="208" height="66" rx="10" fill="var(--track)"/>
  <text x="256" y="172" font-size="19" font-weight="bold" fill="var(--fg)">たまに使う</text>
