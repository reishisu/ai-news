  <rect x="24" y="260" width="180" height="22" rx="6" fill="var(--sub)"/>
  <text x="34" y="277" font-size="16" fill="var(--bg)">説明</text>
  <rect x="242" y="224" width="208" height="66" rx="10" fill="var(--c)" fill-opacity="0.16" stroke="var(--c)" stroke-width="3"/>
