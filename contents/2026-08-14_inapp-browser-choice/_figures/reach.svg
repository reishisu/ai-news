<svg viewBox="0 0 640 314" xmlns="http://www.w3.org/2000/svg" role="img">

  <!-- ===== 左: WebView ===== -->
  <text x="162" y="22" fill="var(--fg)" font-size="14" font-weight="800" text-anchor="middle">WebView</text>
  <text x="162" y="39" fill="var(--sub)" font-size="11.5" text-anchor="middle">embedded user-agent</text>

  <text x="162" y="60" fill="var(--c)" font-size="12" font-weight="800" text-anchor="middle">アプリの手が届く範囲</text>
  <rect x="18" y="66" width="288" height="220" rx="12" fill="none" stroke="var(--c)" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="30" y="76" width="264" height="34" rx="8" fill="var(--c)"/>
  <text x="162" y="98" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">ホストアプリのコード</text>

  <rect x="30" y="126" width="264" height="28" rx="7" fill="var(--track)"/>
  <text x="162" y="145" fill="var(--sub)" font-size="11.5" font-weight="700" text-anchor="middle">アプリと同じ領域</text>

  <rect x="30" y="164" width="264" height="32" rx="8" fill="none" stroke="var(--c)" stroke-width="1.2"/>
  <text x="42" y="185" fill="var(--fg)" font-size="12" font-weight="700">キー入力（全打鍵）</text>
  <text x="282" y="185" fill="var(--c)" font-size="12" font-weight="800" text-anchor="end">読める</text>

  <rect x="30" y="204" width="264" height="32" rx="8" fill="none" stroke="var(--c)" stroke-width="1.2"/>
  <text x="42" y="225" fill="var(--fg)" font-size="12" font-weight="700">ページの中身（DOM）</text>
  <text x="282" y="225" fill="var(--c)" font-size="12" font-weight="800" text-anchor="end">書ける</text>

  <rect x="30" y="244" width="264" height="32" rx="8" fill="none" stroke="var(--c)" stroke-width="1.2"/>
  <text x="42" y="265" fill="var(--fg)" font-size="12" font-weight="700">Cookie（HttpOnly も）</text>
  <text x="282" y="265" fill="var(--c)" font-size="12" font-weight="800" text-anchor="end">読める</text>

  <text x="162" y="306" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">3つとも囲みの中にある</text>

  <!-- ===== 右: アプリ内ブラウザタブ ===== -->
  <text x="478" y="22" fill="var(--fg)" font-size="14" font-weight="800" text-anchor="middle">アプリ内ブラウザタブ</text>
  <text x="478" y="39" fill="var(--sub)" font-size="11.5" text-anchor="middle">in-app browser tab</text>

  <text x="478" y="60" fill="var(--a)" font-size="12" font-weight="800" text-anchor="middle">アプリの手が届く範囲</text>
  <rect x="334" y="66" width="288" height="52" rx="12" fill="none" stroke="var(--a)" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="346" y="76" width="264" height="34" rx="8" fill="var(--a)"/>
  <text x="478" y="98" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">URLを渡して開くだけ</text>

  <rect x="346" y="126" width="264" height="28" rx="7" fill="var(--track)"/>
  <text x="478" y="145" fill="var(--sub)" font-size="11.5" font-weight="700" text-anchor="middle">ブラウザ側の領域</text>

  <rect x="346" y="164" width="264" height="32" rx="8" fill="none" stroke="var(--a)" stroke-width="1.2"/>
  <text x="358" y="185" fill="var(--fg)" font-size="12" font-weight="700">キー入力（全打鍵）</text>
  <text x="598" y="185" fill="var(--a)" font-size="12" font-weight="800" text-anchor="end">届かない</text>

  <rect x="346" y="204" width="264" height="32" rx="8" fill="none" stroke="var(--a)" stroke-width="1.2"/>
  <text x="358" y="225" fill="var(--fg)" font-size="12" font-weight="700">ページの中身（DOM）</text>
  <text x="598" y="225" fill="var(--a)" font-size="12" font-weight="800" text-anchor="end">届かない</text>

  <rect x="346" y="244" width="264" height="32" rx="8" fill="none" stroke="var(--a)" stroke-width="1.2"/>
  <text x="358" y="265" fill="var(--fg)" font-size="12" font-weight="700">Cookie（HttpOnly も）</text>
  <text x="598" y="265" fill="var(--a)" font-size="12" font-weight="800" text-anchor="end">届かない</text>

  <text x="478" y="306" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">3つとも囲みの外にある</text>
</svg>
