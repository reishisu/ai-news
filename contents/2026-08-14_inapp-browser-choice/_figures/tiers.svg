<svg viewBox="0 0 640 296" xmlns="http://www.w3.org/2000/svg" role="img">

  <text x="241" y="26" fill="var(--sub)" font-size="12.5" font-weight="800" text-anchor="middle">Android</text>
  <text x="511" y="26" fill="var(--sub)" font-size="12.5" font-weight="800" text-anchor="middle">iOS</text>

  <!-- 1段目 -->
  <text x="14" y="72" fill="var(--sub)" font-size="11.5" font-weight="700">アプリ専用</text>
  <text x="14" y="88" fill="var(--sub)" font-size="11.5" font-weight="700">の置き場</text>

  <rect x="126" y="40" width="230" height="64" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.2"/>
  <text x="241" y="70" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">WebView</text>
  <text x="241" y="90" fill="var(--sub)" font-size="11.5" text-anchor="middle">アプリ専用のCookie</text>

  <text x="376" y="79" fill="var(--sub)" font-size="18" font-weight="800" text-anchor="middle">=</text>

  <rect x="396" y="40" width="230" height="64" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.2"/>
  <text x="511" y="70" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">WKWebView</text>
  <text x="511" y="90" fill="var(--sub)" font-size="11.5" text-anchor="middle">アプリ専用のCookie</text>

  <!-- 2段目: ここだけ非対称 -->
  <text x="14" y="150" fill="var(--c)" font-size="11.5" font-weight="800">汎用の</text>
  <text x="14" y="166" fill="var(--c)" font-size="11.5" font-weight="800">アプリ内</text>
  <text x="14" y="182" fill="var(--c)" font-size="11.5" font-weight="800">ブラウザ</text>

  <rect x="126" y="118" width="230" height="64" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="241" y="148" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Custom Tabs</text>
  <text x="241" y="168" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">共有Cookieジャー（明記）</text>

  <text x="376" y="158" fill="var(--c)" font-size="20" font-weight="800" text-anchor="middle">≠</text>

  <rect x="396" y="118" width="230" height="64" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="511" y="148" fill="var(--fg)" font-size="12.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">SFSafariViewController</text>
  <text x="511" y="168" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">自前のストア（記述なし）</text>

  <!-- 3段目 -->
  <text x="14" y="228" fill="var(--sub)" font-size="11.5" font-weight="700">認証専用</text>
  <text x="14" y="244" fill="var(--sub)" font-size="11.5" font-weight="700">の入口</text>

  <rect x="126" y="196" width="230" height="64" rx="10" fill="none" stroke="var(--a)" stroke-width="1.5"/>
  <text x="241" y="226" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">AuthTabIntent</text>
  <text x="241" y="246" fill="var(--a)" font-size="11.5" font-weight="700" text-anchor="middle">2025年7月30日に安定版</text>

  <text x="376" y="235" fill="var(--sub)" font-size="18" font-weight="800" text-anchor="middle">=</text>

  <rect x="396" y="196" width="230" height="64" rx="10" fill="none" stroke="var(--a)" stroke-width="1.5"/>
  <text x="511" y="226" fill="var(--fg)" font-size="11.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">ASWebAuthenticationSession</text>
  <text x="511" y="246" fill="var(--a)" font-size="11.5" font-weight="700" text-anchor="middle">既定で共有する</text>

  <text x="320" y="284" fill="var(--sub)" font-size="12.5" text-anchor="middle">「iOS版Custom Tabs」と呼べる段は、2段目ではなく3段目</text>
</svg>
