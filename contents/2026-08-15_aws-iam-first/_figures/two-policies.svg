<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- ロール本体 -->
  <rect x="245" y="16" width="150" height="58" rx="10" fill="var(--new)"/>
  <text x="320" y="41" fill="#fff" font-size="15" font-weight="800" text-anchor="middle">IAMロール</text>
  <text x="320" y="61" fill="#fff" font-size="11.5" text-anchor="middle">ポリシーが必ず2枚付く</text>

  <!-- 分岐の線 -->
  <path d="M320 74 V92 H150 V120" fill="none" stroke="var(--sub)" stroke-width="1.5"/>
  <path d="M320 74 V92 H490 V120" fill="none" stroke="var(--sub)" stroke-width="1.5"/>
  <path d="M144 112 L150 122 L156 112 Z" fill="var(--sub)"/>
  <path d="M484 112 L490 122 L496 112 Z" fill="var(--sub)"/>

  <!-- 左: 信頼ポリシー -->
  <rect x="20" y="124" width="290" height="170" rx="10" fill="var(--track)"/>
  <rect x="20" y="124" width="290" height="36" rx="10" fill="var(--new)"/>
  <rect x="20" y="142" width="290" height="18" fill="var(--new)"/>
  <text x="165" y="148" fill="#fff" font-size="13.5" font-weight="800" text-anchor="middle">信頼ポリシー ─ 誰が借りてよいか</text>

  <text x="36" y="188" fill="var(--sub)" font-size="12" font-family="ui-monospace, monospace">Principal</text>
  <text x="150" y="188" fill="var(--fg)" font-size="12.5">ある（必須）</text>
  <text x="36" y="214" fill="var(--sub)" font-size="12" font-family="ui-monospace, monospace">Resource</text>
  <text x="150" y="214" fill="var(--fg)" font-size="12.5">書かない</text>
  <text x="36" y="240" fill="var(--sub)" font-size="12" font-family="ui-monospace, monospace">Action</text>
  <text x="150" y="240" fill="var(--fg)" font-size="12" font-family="ui-monospace, monospace">sts:AssumeRole</text>
  <text x="36" y="270" fill="var(--sub)" font-size="12">種類</text>
  <text x="150" y="270" fill="var(--fg)" font-size="12.5">リソースベース</text>

  <!-- 右: 許可ポリシー -->
  <rect x="330" y="124" width="290" height="170" rx="10" fill="var(--track)"/>
  <rect x="330" y="124" width="290" height="36" rx="10" fill="var(--new)"/>
  <rect x="330" y="142" width="290" height="18" fill="var(--new)"/>
  <text x="475" y="148" fill="#fff" font-size="13.5" font-weight="800" text-anchor="middle">許可ポリシー ─ 何ができるか</text>

  <text x="346" y="188" fill="var(--sub)" font-size="12" font-family="ui-monospace, monospace">Principal</text>
  <text x="460" y="188" fill="var(--fg)" font-size="12.5">書けない</text>
  <text x="346" y="214" fill="var(--sub)" font-size="12" font-family="ui-monospace, monospace">Resource</text>
  <text x="460" y="214" fill="var(--fg)" font-size="12.5">ある（必須）</text>
  <text x="346" y="240" fill="var(--sub)" font-size="12" font-family="ui-monospace, monospace">Action</text>
  <text x="460" y="240" fill="var(--fg)" font-size="12.5">やりたい操作</text>
  <text x="346" y="270" fill="var(--sub)" font-size="12">種類</text>
  <text x="460" y="270" fill="var(--fg)" font-size="12.5">アイデンティティベース</text>

  <text x="320" y="320" fill="var(--new)" font-size="13" font-weight="800" text-anchor="middle">Principal があれば信頼ポリシー、Resource があれば許可ポリシー</text>
</svg>
