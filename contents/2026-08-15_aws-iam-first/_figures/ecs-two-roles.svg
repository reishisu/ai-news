<svg viewBox="0 0 640 292" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="160" y="32" fill="var(--sub)" font-size="13" font-weight="800" text-anchor="middle">コンテナが起動する前</text>
  <text x="480" y="32" fill="var(--sub)" font-size="13" font-weight="800" text-anchor="middle">コンテナが起動した後</text>

  <!-- 起動という区切り -->
  <path d="M320 46 V234" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 左: タスク実行ロール -->
  <rect x="20" y="52" width="280" height="176" rx="10" fill="var(--track)"/>
  <rect x="20" y="52" width="280" height="36" rx="10" fill="var(--new)"/>
  <rect x="20" y="70" width="280" height="18" fill="var(--new)"/>
  <text x="160" y="76" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">① タスク実行ロール</text>

  <text x="36" y="116" fill="var(--sub)" font-size="11.5">使うのは</text>
  <text x="112" y="116" fill="var(--fg)" font-size="12">ECS / Fargate のエージェント</text>
  <text x="36" y="142" fill="var(--sub)" font-size="11.5">やること</text>
  <text x="112" y="142" fill="var(--fg)" font-size="12">イメージ取得・ログ送信</text>
  <text x="36" y="168" fill="var(--sub)" font-size="11.5">書く欄</text>
  <text x="112" y="168" fill="var(--fg)" font-size="12" font-family="ui-monospace, monospace">executionRoleArn</text>
  <path d="M36 186 H284" stroke="var(--sub)" stroke-width="1" opacity="0.4"/>
  <text x="36" y="210" fill="var(--fg)" font-size="12.5" font-weight="700">コンテナの中からは使えない</text>

  <!-- 右: タスクロール -->
  <rect x="340" y="52" width="280" height="176" rx="10" fill="var(--track)"/>
  <rect x="340" y="52" width="280" height="36" rx="10" fill="var(--new)"/>
  <rect x="340" y="70" width="280" height="18" fill="var(--new)"/>
  <text x="480" y="76" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">② タスクロール</text>

  <text x="356" y="116" fill="var(--sub)" font-size="11.5">使うのは</text>
  <text x="432" y="116" fill="var(--fg)" font-size="12">コンテナの中のアプリ</text>
  <text x="356" y="142" fill="var(--sub)" font-size="11.5">やること</text>
  <text x="432" y="142" fill="var(--fg)" font-size="12">S3を読む・DynamoDBを書く</text>
  <text x="356" y="168" fill="var(--sub)" font-size="11.5">書く欄</text>
  <text x="432" y="168" fill="var(--fg)" font-size="12" font-family="ui-monospace, monospace">taskRoleArn</text>
  <path d="M356 186 H604" stroke="var(--sub)" stroke-width="1" opacity="0.4"/>
  <text x="356" y="210" fill="var(--fg)" font-size="12.5" font-weight="700">アプリのコードが直接使う</text>

  <text x="320" y="264" fill="var(--new)" font-size="13" font-weight="800" text-anchor="middle">S3が読めないときに直すのは、右のタスクロール</text>
</svg>
