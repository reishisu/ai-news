    <text x="30" y="74" font-size="21" font-weight="700" fill="var(--sub)">請求される金額？</text>
  </g>
  <g data-step="2">
    <line x1="24" y1="67" x2="216" y2="67" stroke="var(--c)" stroke-width="4"/>
    <rect x="14" y="92" width="432" height="58" rx="10" fill="var(--b)" opacity="0.24"/>
    <text x="30" y="118" font-size="21" font-weight="700" fill="var(--b)">API単価に換算した推定値</text>
