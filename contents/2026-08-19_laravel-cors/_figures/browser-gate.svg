<svg viewBox="0 0 640 316" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="bg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>

  <text x="320" y="28" fill="var(--sub)" font-size="12.5" font-weight="700" text-anchor="middle">サーバーは同じ。違うのは受け取る側だけ</text>

  <!-- サーバー -->
  <rect x="14" y="100" width="176" height="118" rx="12" fill="var(--track)" stroke="var(--sub)" stroke-width="1.2"/>
  <text x="102" y="130" fill="var(--fg)" font-size="14.5" font-weight="800" text-anchor="middle">Laravel</text>
  <text x="102" y="152" fill="var(--fg)" font-size="12.5" text-anchor="middle">200 OK ＋ 本文</text>
  <text x="102" y="176" fill="var(--fg)" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">{"msg":"hello"}</text>
  <text x="102" y="200" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">CORSヘッダーは無し</text>

  <!-- 分岐 -->
  <path d="M190 150 L206 150 L206 105 L214 105" fill="none" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#bg-ar)"/>
  <path d="M190 176 L206 176 L206 226 L214 226" fill="none" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#bg-ar)"/>

  <!-- curl -->
  <rect x="222" y="74" width="190" height="62" rx="10" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="317" y="102" fill="var(--a)" font-size="15.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">curl</text>
  <text x="317" y="122" fill="var(--sub)" font-size="12" text-anchor="middle">ヘッダーを見ない</text>

  <path d="M412 105 L432 105" fill="none" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#bg-ar)"/>

  <rect x="440" y="74" width="186" height="62" rx="10" fill="var(--a)"/>
  <text x="533" y="100" fill="#ffffff" font-size="13.5" font-weight="800" text-anchor="middle">そのまま受け取る</text>
  <text x="533" y="121" fill="#ffffff" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">{"msg":"hello"}</text>

  <!-- ブラウザ -->
  <rect x="222" y="168" width="190" height="116" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="317" y="196" fill="var(--c)" font-size="15.5" font-weight="800" text-anchor="middle">ブラウザ</text>
  <text x="317" y="220" fill="var(--fg)" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">Access-Control-</text>
  <text x="317" y="236" fill="var(--fg)" font-size="11.5" text-anchor="middle">Allow-Origin を確認</text>
  <text x="317" y="260" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">無いので JS に渡さない</text>

  <path d="M412 226 L432 226" fill="none" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#bg-ar)"/>

  <rect x="440" y="182" width="186" height="88" rx="10" fill="var(--c)"/>
  <text x="533" y="210" fill="#ffffff" font-size="13.5" font-weight="800" text-anchor="middle">JSには届かない</text>
  <text x="533" y="234" fill="#ffffff" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">TypeError:</text>
  <text x="533" y="252" fill="#ffffff" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">Failed to fetch</text>

  <text x="320" y="308" fill="var(--sub)" font-size="12.5" text-anchor="middle">止めているのはサーバーではなく、ブラウザ側</text>
</svg>
