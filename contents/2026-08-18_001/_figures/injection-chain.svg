<svg viewBox="0 0 640 414" xmlns="http://www.w3.org/2000/svg" role="img">

  <defs>
    <marker id="ic-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
    <marker id="ic-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--a)"/>
    </marker>
    <marker id="ic-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>

  <text x="320" y="22" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">Issueのタイトルが実行されるまで — 展開はシェルより先に走る</text>

  <!-- 入力 -->
  <rect x="160" y="36" width="320" height="52" rx="10" fill="none" stroke="var(--c)" stroke-width="1.6"/>
  <text x="320" y="58" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle">Issueのタイトル（認証不要で誰でも書ける）</text>
  <text x="320" y="78" fill="var(--c)" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">' を1個混ぜるだけでよい</text>

  <path d="M250 88 L190 112" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ic-s)"/>
  <path d="M390 88 L450 112" stroke="var(--sub)" stroke-width="1.5" marker-end="url(#ic-s)"/>

  <!-- 見出しピル -->
  <rect x="16" y="118" width="296" height="26" rx="13" fill="var(--track)"/>
  <text x="164" y="136" fill="var(--c)" font-size="12" font-weight="800" text-anchor="middle">危険: run: の中に直接展開</text>
  <rect x="328" y="118" width="296" height="26" rx="13" fill="var(--track)"/>
  <text x="476" y="136" fill="var(--a)" font-size="12" font-weight="800" text-anchor="middle">安全: env: の中間変数を経由</text>

  <!-- ① -->
  <rect x="16" y="156" width="296" height="60" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.3"/>
  <text x="164" y="180" fill="var(--fg)" font-size="11.5" font-weight="800" text-anchor="middle">① GitHubが ${{ }} を展開</text>
  <text x="164" y="201" fill="var(--sub)" font-size="12" text-anchor="middle">run: の行に文字がそのまま入る</text>

  <rect x="328" y="156" width="296" height="60" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.3"/>
  <text x="476" y="180" fill="var(--fg)" font-size="11.5" font-weight="800" text-anchor="middle">① GitHubが ${{ }} を展開</text>
  <text x="476" y="201" fill="var(--sub)" font-size="12" text-anchor="middle">env: の値になる。run: は不変</text>

  <path d="M164 218 L164 232" stroke="var(--c)" stroke-width="1.6" marker-end="url(#ic-c)"/>
  <path d="M476 218 L476 232" stroke="var(--a)" stroke-width="1.6" marker-end="url(#ic-a)"/>

  <!-- ② -->
  <rect x="16" y="240" width="296" height="66" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.3"/>
  <text x="164" y="264" fill="var(--fg)" font-size="11.5" font-weight="800" text-anchor="middle">② シェルが受け取る行</text>
  <text x="164" y="288" fill="var(--c)" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">echo ''; 任意のコマンド; #'</text>

  <rect x="328" y="240" width="296" height="66" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.3"/>
  <text x="476" y="264" fill="var(--fg)" font-size="11.5" font-weight="800" text-anchor="middle">② シェルが受け取る行</text>
  <text x="476" y="288" fill="var(--a)" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">jq --arg title "$ISSUE_TITLE"</text>

  <path d="M164 308 L164 322" stroke="var(--c)" stroke-width="1.6" marker-end="url(#ic-c)"/>
  <path d="M476 308 L476 322" stroke="var(--a)" stroke-width="1.6" marker-end="url(#ic-a)"/>

  <!-- ③ -->
  <rect x="16" y="330" width="296" height="44" rx="10" fill="none" stroke="var(--c)" stroke-width="1.8"/>
  <text x="164" y="358" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">③ 任意コマンドが実行される</text>

  <rect x="328" y="330" width="296" height="44" rx="10" fill="none" stroke="var(--a)" stroke-width="1.8"/>
  <text x="476" y="358" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">③ ただの文字列で終わる</text>

  <line x1="16" y1="386" x2="624" y2="386" stroke="var(--track)" stroke-width="1.5"/>
  <text x="320" y="404" fill="var(--fg)" font-size="12" font-weight="700" text-anchor="middle">sed のエスケープが走るのは②の中。①の時点でもう手遅れ</text>
</svg>
