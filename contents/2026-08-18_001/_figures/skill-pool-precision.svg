<svg viewBox="0 0 640 248" xmlns="http://www.w3.org/2000/svg" role="img">

  <text x="320" y="22" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">Skillを増やすほど、正しいSkillが選ばれなくなる</text>
  <text x="320" y="42" fill="var(--sub)" font-size="11" text-anchor="middle">横軸＝実際に使われたSkillの精度。査読前の要旨に載っている数値</text>

  <!-- 目盛り -->
  <text x="180" y="72" fill="var(--sub)" font-size="10.5" text-anchor="middle">0%</text>
  <text x="560" y="72" fill="var(--sub)" font-size="10.5" text-anchor="middle">100%</text>
  <line x1="180" y1="80" x2="180" y2="180" stroke="var(--track)" stroke-width="1.2" stroke-dasharray="4 4"/>
  <line x1="560" y1="80" x2="560" y2="180" stroke="var(--track)" stroke-width="1.2" stroke-dasharray="4 4"/>

  <!-- 5個 -->
  <text x="168" y="110" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="end">Skillプール 5個</text>
  <rect x="180" y="88" width="380" height="32" rx="6" fill="var(--track)"/>
  <rect x="180" y="88" width="112" height="32" rx="6" fill="var(--old)"/>
  <text x="302" y="110" fill="var(--fg)" font-size="12.5" font-weight="800">29.6%</text>

  <!-- 100個 -->
  <text x="168" y="164" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="end">Skillプール 100個</text>
  <rect x="180" y="142" width="380" height="32" rx="6" fill="var(--track)"/>
  <rect x="180" y="142" width="13" height="32" rx="4" fill="var(--c)"/>
  <text x="203" y="164" fill="var(--c)" font-size="12.5" font-weight="800">3.3%</text>

  <line x1="16" y1="196" x2="624" y2="196" stroke="var(--track)" stroke-width="1.5"/>
  <text x="320" y="216" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">プールを20倍にすると、精度は約9分の1</text>
  <text x="320" y="238" fill="var(--sub)" font-size="11.5" text-anchor="middle">5個の時点でも、正しく選ばれるのは3回に1回以下</text>
</svg>
