<svg viewBox="0 0 640 262" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="380" y="30" fill="var(--fg)" font-size="12.5" font-weight="800" text-anchor="middle">未trust のフォルダ</text>
  <text x="550" y="30" fill="var(--sub)" font-size="12.5" font-weight="800" text-anchor="middle">trust 済み</text>

  <!-- 1: project allow -->
  <rect x="10" y="42" width="280" height="40" rx="8" fill="var(--track)"/>
  <text x="24" y="67" fill="var(--fg)" font-size="12.5">プロジェクト設定の allow</text>
  <rect x="300" y="42" width="160" height="40" rx="8" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="380" y="67" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">黙って捨てられる</text>
  <text x="550" y="67" fill="var(--sub)" font-size="12.5" text-anchor="middle">効く</text>

  <!-- 2: deny -->
  <rect x="10" y="90" width="280" height="40" rx="8" fill="var(--track)"/>
  <text x="24" y="115" fill="var(--fg)" font-size="12.5">deny ルール</text>
  <rect x="300" y="90" width="160" height="40" rx="8" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="380" y="115" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">効く</text>
  <text x="550" y="115" fill="var(--sub)" font-size="12.5" text-anchor="middle">効く</text>

  <!-- 3: ask -->
  <rect x="10" y="138" width="280" height="40" rx="8" fill="var(--track)"/>
  <text x="24" y="163" fill="var(--fg)" font-size="12.5">ask ルール</text>
  <rect x="300" y="138" width="160" height="40" rx="8" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="380" y="163" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">効く</text>
  <text x="550" y="163" fill="var(--sub)" font-size="12.5" text-anchor="middle">効く</text>

  <!-- 4: hook -->
  <rect x="10" y="186" width="280" height="40" rx="8" fill="var(--track)"/>
  <text x="24" y="211" fill="var(--fg)" font-size="12.5">PreToolUse フック</text>
  <rect x="300" y="186" width="160" height="40" rx="8" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="380" y="211" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">効く</text>
  <text x="550" y="211" fill="var(--sub)" font-size="12.5" text-anchor="middle">効く</text>

  <text x="10" y="250" fill="var(--sub)" font-size="12">allow だけが「能力を与える」側。落ちるのはそこ1行だけ</text>
</svg>
