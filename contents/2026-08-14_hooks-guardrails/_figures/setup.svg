<svg viewBox="0 0 640 272" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 一本道 -->
  <rect x="10" y="50" width="132" height="46" rx="9" fill="var(--track)"/>
  <text x="76" y="72" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">claude -p</text>
  <text x="76" y="89" fill="var(--sub)" font-size="11.5" text-anchor="middle">「push して」</text>

  <path d="M144 73 L168 73" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="172" y="50" width="146" height="46" rx="9" fill="var(--track)"/>
  <text x="245" y="72" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">Bash(git push)</text>
  <text x="245" y="89" fill="var(--sub)" font-size="11.5" text-anchor="middle">ツール呼び出し</text>

  <path d="M320 73 L344 73" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="348" y="50" width="128" height="46" rx="9" fill="none" stroke="var(--new)" stroke-width="2"/>
  <text x="412" y="72" fill="var(--new)" font-size="12.5" font-weight="800" text-anchor="middle">権限判定</text>
  <text x="412" y="89" fill="var(--sub)" font-size="11.5" text-anchor="middle">deny / フック</text>

  <path d="M478 73 L502 73" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="506" y="50" width="124" height="46" rx="9" fill="var(--track)"/>
  <text x="568" y="72" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, monospace">remote.git</text>
  <text x="568" y="89" fill="var(--sub)" font-size="11.5" text-anchor="middle">bare リポジトリ</text>

  <!-- 分岐して落ちる2つの根拠 -->
  <path d="M76 100 L76 150" stroke="var(--c)" stroke-width="1.6" stroke-dasharray="5 4"/>
  <path d="M568 100 L568 150" stroke="var(--a)" stroke-width="1.8"/>

  <rect x="10" y="152" width="300" height="72" rx="9" fill="none" stroke="var(--c)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="178" fill="var(--fg)" font-size="12.5" text-anchor="middle">モデルの自己申告</text>
  <text x="160" y="198" fill="var(--fg)" font-size="12.5" text-anchor="middle">「実行しませんでした」</text>
  <text x="160" y="217" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">✕ 判定に使わない</text>

  <rect x="330" y="152" width="300" height="72" rx="9" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="480" y="178" fill="var(--fg)" font-size="12.5" text-anchor="middle">リモートの main が指す</text>
  <text x="480" y="198" fill="var(--fg)" font-size="12.5" text-anchor="middle">コミットIDが動いたか</text>
  <text x="480" y="217" fill="var(--a)" font-size="12.5" font-weight="800" text-anchor="middle">○ これだけで判定</text>

  <text x="320" y="252" fill="var(--sub)" font-size="12" text-anchor="middle">言葉ではなく副作用で成否を決める</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>
</svg>
