<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 左: ブラウザ経路 -->
  <rect x="14" y="14" width="292" height="50" rx="10" fill="none" stroke="var(--b)" stroke-width="2"/>
  <text x="160" y="36" fill="var(--b)" font-size="13.5" font-weight="800" text-anchor="middle">ブラウザからのアクセス</text>
  <text x="160" y="55" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">php artisan serve</text>

  <!-- 右: テスト経路 -->
  <rect x="334" y="14" width="292" height="50" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="480" y="36" fill="var(--c)" font-size="13.5" font-weight="800" text-anchor="middle">テストの実行</text>
  <text x="480" y="55" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">php artisan test</text>

  <path d="M160 64 L160 86" stroke="var(--b)" stroke-width="1.8" marker-end="url(#arB)"/>
  <path d="M480 64 L480 86" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <rect x="14" y="90" width="292" height="58" rx="10" fill="var(--track)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="160" y="114" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle">.env をそのまま読む</text>
  <text x="160" y="136" fill="var(--sub)" font-size="12" text-anchor="middle">上書きするものは無い</text>

  <rect x="334" y="90" width="292" height="58" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="1.5"/>
  <text x="480" y="114" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle">phpunit.xml が上書きする</text>
  <text x="480" y="136" fill="var(--fg)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">DB_DATABASE=:memory:</text>

  <path d="M160 148 L160 172" stroke="var(--b)" stroke-width="1.8" marker-end="url(#arB)"/>
  <path d="M480 148 L480 172" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <rect x="14" y="176" width="292" height="64" rx="10" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="160" y="202" fill="var(--fg)" font-size="12.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">database/database.sqlite</text>
  <text x="160" y="224" fill="var(--sub)" font-size="12" text-anchor="middle">users を含む10テーブルがある</text>

  <rect x="334" y="176" width="292" height="64" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="480" y="202" fill="var(--fg)" font-size="12.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">:memory:</text>
  <text x="480" y="224" fill="var(--sub)" font-size="12" text-anchor="middle">毎回まっさら。表は1つも無い</text>

  <path d="M160 240 L160 262" stroke="var(--a)" stroke-width="1.8" marker-end="url(#arA)"/>
  <path d="M480 240 L480 262" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <text x="160" y="280" fill="var(--a)" font-size="13" font-weight="800" text-anchor="middle">画面は普通に動く</text>
  <text x="480" y="280" fill="var(--c)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">no such table: users</text>

  <text x="320" y="306" fill="var(--sub)" font-size="12.5" text-anchor="middle">同じアプリでも、テストだけ別のDBを見ている</text>
  <text x="320" y="326" fill="var(--sub)" font-size="12.5" text-anchor="middle">その空のDBに表を作るのが RefreshDatabase</text>

  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--b)"/>
    </marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
    <marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--a)"/>
    </marker>
  </defs>
</svg>
