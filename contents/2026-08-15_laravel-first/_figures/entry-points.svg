<svg viewBox="0 0 640 366" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 入口2つ -->
  <rect x="40" y="16" width="240" height="54" rx="10" fill="none" stroke="var(--b)" stroke-width="2"/>
  <text x="160" y="40" fill="var(--b)" font-size="13.5" font-weight="800" text-anchor="middle">ブラウザから</text>
  <text x="160" y="59" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">http://localhost:8000/</text>

  <rect x="360" y="16" width="240" height="54" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="480" y="40" fill="var(--c)" font-size="13.5" font-weight="800" text-anchor="middle">ターミナルから</text>
  <text x="480" y="59" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">php artisan test</text>

  <path d="M160 70 L160 92" stroke="var(--b)" stroke-width="1.8" marker-end="url(#arB)"/>
  <path d="M480 70 L480 92" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <!-- 入口ファイル -->
  <rect x="40" y="96" width="240" height="44" rx="10" fill="var(--track)" stroke="var(--b)" stroke-width="1.5"/>
  <text x="160" y="124" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">public/index.php</text>

  <rect x="360" y="96" width="240" height="44" rx="10" fill="var(--track)" stroke="var(--c)" stroke-width="1.5"/>
  <text x="480" y="124" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">artisan</text>

  <path d="M160 140 L160 164" stroke="var(--b)" stroke-width="1.8" marker-end="url(#arB)"/>
  <path d="M480 140 L480 164" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <!-- 共通部分 -->
  <rect x="100" y="168" width="440" height="88" rx="12" fill="var(--track)" stroke="var(--fg)" stroke-width="1.5"/>
  <text x="320" y="192" fill="var(--sub)" font-size="12.5" font-weight="800" text-anchor="middle">ここから2行は完全に同じ</text>
  <text x="320" y="216" fill="var(--fg)" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">require vendor/autoload.php</text>
  <text x="320" y="240" fill="var(--fg)" font-size="13" text-anchor="middle" font-family="ui-monospace, monospace">$app = require bootstrap/app.php</text>

  <path d="M160 256 L160 282" stroke="var(--b)" stroke-width="1.8" marker-end="url(#arB)"/>
  <path d="M480 256 L480 282" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arC)"/>

  <!-- 分岐する最後の1行 -->
  <rect x="40" y="286" width="240" height="50" rx="10" fill="none" stroke="var(--b)" stroke-width="2"/>
  <text x="160" y="308" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">handleRequest()</text>
  <text x="160" y="328" fill="var(--sub)" font-size="12" text-anchor="middle">HTMLを返す</text>

  <rect x="360" y="286" width="240" height="50" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="480" y="308" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">handleCommand()</text>
  <text x="480" y="328" fill="var(--sub)" font-size="12" text-anchor="middle">コマンドを実行して終了</text>

  <text x="320" y="356" fill="var(--sub)" font-size="12.5" text-anchor="middle">composer install をしていないと、どちらも1行目で止まる</text>

  <defs>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--b)"/>
    </marker>
    <marker id="arC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
  </defs>
</svg>
