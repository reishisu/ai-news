<svg viewBox="0 0 640 252" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="265" y="32" fill="var(--sub)" font-size="12.5" text-anchor="middle">apply の前</text>
  <text x="475" y="32" fill="var(--sub)" font-size="12.5" text-anchor="middle">apply のあと</text>
  <path d="M340 40 L340 198" stroke="var(--sub)" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- + 作る -->
  <rect x="14" y="53" width="48" height="30" rx="8" fill="var(--track)" stroke="var(--new)" stroke-width="1.5"/>
  <text x="38" y="74" fill="var(--new)" font-size="16" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">+</text>
  <text x="70" y="73" fill="var(--fg)" font-size="12.5" font-weight="700">新しく作る</text>
  <rect x="190" y="56" width="150" height="24" rx="6" fill="none" stroke="var(--sub)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="265" y="72" fill="var(--sub)" font-size="11.5" text-anchor="middle">まだ無い</text>
  <rect x="340" y="56" width="270" height="24" rx="6" fill="var(--new)"/>
  <text x="475" y="72" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">作られて存在する</text>

  <!-- ~ 直す -->
  <rect x="14" y="109" width="48" height="30" rx="8" fill="var(--track)" stroke="var(--new)" stroke-width="1.5"/>
  <text x="38" y="130" fill="var(--new)" font-size="16" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">~</text>
  <text x="70" y="129" fill="var(--fg)" font-size="12.5" font-weight="700">その場で直す</text>
  <rect x="190" y="112" width="150" height="24" rx="6" fill="var(--old)"/>
  <text x="265" y="128" fill="var(--fg)" font-size="11.5" text-anchor="middle">ある</text>
  <rect x="340" y="112" width="270" height="24" rx="6" fill="var(--new)"/>
  <text x="475" y="128" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">止まらずに更新される</text>

  <!-- -/+ 作り直す -->
  <rect x="14" y="165" width="48" height="30" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2"/>
  <text x="38" y="186" fill="var(--c)" font-size="15" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">-/+</text>
  <text x="70" y="185" fill="var(--fg)" font-size="12.5" font-weight="700">壊して作り直す</text>
  <rect x="190" y="168" width="150" height="24" rx="6" fill="var(--old)"/>
  <text x="265" y="184" fill="var(--fg)" font-size="11.5" text-anchor="middle">ある</text>
  <rect x="340" y="168" width="100" height="24" rx="6" fill="var(--track)" stroke="var(--c)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="390" y="184" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">消えている</text>
  <rect x="440" y="168" width="170" height="24" rx="6" fill="var(--new)"/>
  <text x="525" y="184" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">作り直される</text>

  <text x="390" y="212" fill="var(--c)" font-size="12" font-weight="800" text-anchor="middle">この間は存在しない</text>
  <text x="320" y="240" fill="var(--sub)" font-size="12.5" text-anchor="middle">-/+ は集計行が 1 to add, 1 to destroy になる</text>
</svg>
