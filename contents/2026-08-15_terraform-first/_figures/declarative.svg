<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- タイトル -->
  <text x="163" y="26" fill="var(--sub)" font-size="14" font-weight="800" text-anchor="middle">手順を書く（命令的）</text>
  <text x="477" y="26" fill="var(--new)" font-size="14" font-weight="800" text-anchor="middle">最終形を書く（宣言的）</text>

  <!-- パネル -->
  <rect x="20" y="44" width="286" height="210" rx="12" fill="none" stroke="var(--sub)" stroke-width="1.5"/>
  <rect x="334" y="44" width="286" height="210" rx="12" fill="none" stroke="var(--new)" stroke-width="2"/>

  <text x="163" y="70" fill="var(--fg)" font-size="12.5" text-anchor="middle">「サーバーを1台つくれ」</text>
  <text x="477" y="70" fill="var(--fg)" font-size="12.5" text-anchor="middle">「サーバーは3台」</text>
  <path d="M20 82 L306 82" stroke="var(--sub)" stroke-width="1" opacity="0.4"/>
  <path d="M334 82 L620 82" stroke="var(--new)" stroke-width="1" opacity="0.4"/>

  <!-- 左: 1回目 -->
  <text x="36" y="115" fill="var(--sub)" font-size="12.5">1回目</text>
  <rect x="84" y="99" width="26" height="22" rx="4" fill="var(--track)" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="292" y="115" fill="var(--fg)" font-size="12.5" text-anchor="end">1台</text>
  <!-- 左: 2回目 -->
  <text x="36" y="159" fill="var(--sub)" font-size="12.5">2回目</text>
  <rect x="84" y="143" width="26" height="22" rx="4" fill="var(--track)" stroke="var(--sub)" stroke-width="1.5"/>
  <rect x="116" y="143" width="26" height="22" rx="4" fill="var(--track)" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="292" y="159" fill="var(--c)" font-size="12.5" font-weight="700" text-anchor="end">2台</text>
  <!-- 左: 3回目 -->
  <text x="36" y="203" fill="var(--sub)" font-size="12.5">3回目</text>
  <rect x="84" y="187" width="26" height="22" rx="4" fill="var(--track)" stroke="var(--sub)" stroke-width="1.5"/>
  <rect x="116" y="187" width="26" height="22" rx="4" fill="var(--track)" stroke="var(--sub)" stroke-width="1.5"/>
  <rect x="148" y="187" width="26" height="22" rx="4" fill="var(--track)" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="292" y="203" fill="var(--c)" font-size="12.5" font-weight="700" text-anchor="end">3台</text>

  <text x="163" y="238" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">実行するたびに増える</text>

  <!-- 右: 1回目 -->
  <text x="350" y="115" fill="var(--sub)" font-size="12.5">1回目</text>
  <rect x="398" y="99" width="26" height="22" rx="4" fill="var(--new)"/>
  <rect x="430" y="99" width="26" height="22" rx="4" fill="var(--new)"/>
  <rect x="462" y="99" width="26" height="22" rx="4" fill="var(--new)"/>
  <text x="606" y="115" fill="var(--fg)" font-size="12.5" text-anchor="end">3台つくる</text>
  <!-- 右: 2回目 -->
  <text x="350" y="159" fill="var(--sub)" font-size="12.5">2回目</text>
  <rect x="398" y="143" width="26" height="22" rx="4" fill="var(--new)"/>
  <rect x="430" y="143" width="26" height="22" rx="4" fill="var(--new)"/>
  <rect x="462" y="143" width="26" height="22" rx="4" fill="var(--new)"/>
  <text x="606" y="159" fill="var(--fg)" font-size="12.5" text-anchor="end">何もしない</text>
  <!-- 右: 3回目 -->
  <text x="350" y="203" fill="var(--sub)" font-size="12.5">3回目</text>
  <rect x="398" y="187" width="26" height="22" rx="4" fill="var(--new)"/>
  <rect x="430" y="187" width="26" height="22" rx="4" fill="var(--new)"/>
  <rect x="462" y="187" width="26" height="22" rx="4" fill="var(--new)"/>
  <text x="606" y="203" fill="var(--fg)" font-size="12.5" text-anchor="end">何もしない</text>

  <text x="477" y="238" fill="var(--new)" font-size="12.5" font-weight="800" text-anchor="middle">何度実行しても3台のまま</text>

  <text x="320" y="284" fill="var(--sub)" font-size="12.5" text-anchor="middle">2台しか無ければ足りない1台だけ作る。差分の計算は Terraform 側</text>
</svg>
