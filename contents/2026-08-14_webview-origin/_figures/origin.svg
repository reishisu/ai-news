<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>

  <text x="14" y="24" fill="var(--sub)" font-size="12" font-weight="700">読み込み方</text>
  <text x="266" y="24" fill="var(--sub)" font-size="12" font-weight="700">APIに送られるOrigin</text>
  <text x="500" y="24" fill="var(--sub)" font-size="12" font-weight="700">APIの返事</text>

  <!-- 行1: file:// -->
  <rect x="14" y="44" width="222" height="62" rx="10" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="125" y="70" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">file:// で読み込む</text>
  <text x="125" y="91" fill="var(--sub)" font-size="11.5" text-anchor="middle">loadData / loadFileURL も同じ</text>

  <path d="M240 75 L262 75" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="266" y="52" width="152" height="46" rx="9" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="342" y="81" fill="var(--c)" font-size="15" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">null</text>

  <path d="M422 75 L444 75" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="448" y="52" width="178" height="46" rx="9" fill="var(--c)"/>
  <text x="537" y="81" fill="#ffffff" font-size="13.5" font-weight="800" text-anchor="middle">拒否される</text>

  <!-- 行2: https:// -->
  <rect x="14" y="150" width="222" height="62" rx="10" fill="var(--track)" stroke="var(--a)" stroke-width="1.5"/>
  <text x="125" y="176" fill="var(--fg)" font-size="13.5" font-weight="700" text-anchor="middle">https:// で読み込む</text>
  <text x="125" y="197" fill="var(--sub)" font-size="11.5" text-anchor="middle">WebViewAssetLoader を使う</text>

  <path d="M240 181 L262 181" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="266" y="158" width="152" height="46" rx="9" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="342" y="180" fill="var(--a)" font-size="12" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">https://appassets.</text>
  <text x="342" y="196" fill="var(--a)" font-size="12" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">androidplatform.net</text>

  <path d="M422 181 L444 181" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <rect x="448" y="158" width="178" height="46" rx="9" fill="var(--a)"/>
  <text x="537" y="187" fill="#ffffff" font-size="13.5" font-weight="800" text-anchor="middle">許可リストに書ける</text>

  <text x="320" y="238" fill="var(--sub)" font-size="12.5" text-anchor="middle">中身が同じHTMLでも、読み込み方だけで結果が変わる</text>
</svg>
