  <text x="378" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fg)">実装</text>
  <rect x="480" y="86" width="96" height="40" rx="9" fill="var(--old)"/>
  <text x="528" y="111" text-anchor="middle" font-size="12.5" font-weight="700" fill="var(--fg)">検証</text>
  <rect x="480" y="152" width="96" height="40" rx="9" fill="var(--new)"/>
  <text x="528" y="177" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">統合</text>
  <path d="M378 126 v20" stroke="var(--sub)" stroke-width="3"/>
