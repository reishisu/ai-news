  <path d="M528 126 v20" stroke="var(--sub)" stroke-width="3"/>
  <path d="M528 152 l-6 -10 M528 152 l6 -10" stroke="var(--sub)" stroke-width="3" fill="none"/>
  <text x="452" y="222" text-anchor="middle" font-size="12.5" fill="var(--sub)">順序・分岐・並列・戻り先を先に決めておく</text>
