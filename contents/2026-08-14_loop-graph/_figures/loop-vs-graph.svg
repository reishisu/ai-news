  <rect x="104" y="120" width="92" height="40" rx="20" fill="var(--new)"/>
  <text x="150" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">実行 → 確認</text>
  <text x="150" y="222" text-anchor="middle" font-size="12.5" fill="var(--sub)">条件を満たすまで自分で回り続ける</text>

