<svg viewBox="0 0 460 240" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="14" y="26" font-size="22" font-weight="700" fill="var(--fg)">頼んだもの と 補完されたもの</text>
  <g data-step="1">
    <rect x="14" y="44" width="210" height="180" rx="10" fill="var(--b)" opacity="0.28"/>
    <text x="30" y="70" font-size="16" font-weight="700" fill="var(--fg)">頼んだ5つ</text>
    <text x="30" y="98" font-size="14" fill="var(--fg)">・作成・編集・削除</text>
    <text x="30" y="122" font-size="14" fill="var(--fg)">・localStorage保存</text>
    <text x="30" y="146" font-size="14" fill="var(--fg)">・日本語UI</text>
    <text x="30" y="170" font-size="14" fill="var(--fg)">・1枚だけ</text>
    <text x="30" y="194" font-size="14" fill="var(--fg)">・ライブラリ無し</text>
  </g>
  <g data-step="2">
    <rect x="236" y="44" width="210" height="180" rx="10" fill="var(--track)"/>
    <text x="252" y="70" font-size="16" font-weight="700" fill="var(--acc)">頼んでいない補完4つ</text>
    <text x="252" y="98" font-size="14" fill="var(--fg)">・検索ボックス</text>
    <text x="252" y="122" font-size="14" fill="var(--fg)">・更新日時の表示</text>
    <text x="252" y="146" font-size="14" fill="var(--fg)">・削除前の確認</text>
    <text x="252" y="170" font-size="14" fill="var(--fg)">・空のときの案内</text>
    <text x="252" y="196" font-size="13" fill="var(--sub)">要否は指示に書くのが確実</text>
  </g>
</svg>