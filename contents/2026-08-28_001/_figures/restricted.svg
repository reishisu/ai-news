  <text x="62" y="112" font-size="15" fill="var(--fg)" text-anchor="middle">実行</text>

  <rect x="126" y="70" width="104" height="52" rx="9" fill="var(--track)"/>
  <text x="178" y="102" font-size="15" fill="var(--fg)" text-anchor="middle">WebFetch</text>

  <rect x="242" y="70" width="104" height="52" rx="9" fill="var(--track)"/>
