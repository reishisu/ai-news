<svg viewBox="0 0 640 350" xmlns="http://www.w3.org/2000/svg" role="img">

  <text x="320" y="26" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">コードサイズを削るほど、フレーム時間の悪化も大きくなる</text>

  <!-- 目盛り線 -->
  <g stroke="var(--track)" stroke-width="1">
    <line x1="90" y1="198" x2="610" y2="198"/>
    <line x1="90" y1="138" x2="610" y2="138"/>
    <line x1="90" y1="78" x2="610" y2="78"/>
  </g>

  <!-- 軸 -->
  <line x1="90" y1="70" x2="90" y2="258" stroke="var(--sub)" stroke-width="1.2"/>
  <line x1="90" y1="258" x2="610" y2="258" stroke="var(--sub)" stroke-width="1.2"/>

  <g fill="var(--sub)" font-size="10.5" text-anchor="end">
    <text x="82" y="262">0</text>
    <text x="82" y="202">2%</text>
    <text x="82" y="142">4%</text>
    <text x="82" y="82">6%</text>
  </g>
  <g fill="var(--sub)" font-size="10.5" text-anchor="middle">
    <text x="249.4" y="276">10%</text>
    <text x="408.8" y="276">20%</text>
    <text x="568.1" y="276">30%</text>
  </g>

  <text x="24" y="164" fill="var(--sub)" font-size="11.5" text-anchor="middle" transform="rotate(-90 24 164)">フレーム時間の悪化 ↑</text>
  <text x="350" y="296" fill="var(--sub)" font-size="11.5" text-anchor="middle">コードサイズ削減 →</text>

  <!-- 3点を結ぶ線 -->
  <polyline points="90,258 229.5,194.1 430.3,121.2 544.2,100.5" fill="none" stroke="var(--sub)" stroke-width="1.6" stroke-dasharray="5 4" opacity="0.7"/>

  <!-- 既定 -->
  <circle cx="90" cy="258" r="4.5" fill="var(--sub)"/>
  <text x="101" y="253" fill="var(--sub)" font-size="10.5" text-anchor="start">既定 Shorter Build Time（基準）</text>

  <!-- P1 -->
  <circle cx="229.5" cy="194.1" r="6.5" fill="var(--a)"/>
  <text x="229.5" y="220" fill="var(--fg)" font-size="11.5" font-weight="700" text-anchor="middle">Disk Size（旧）</text>
  <text x="229.5" y="236" fill="var(--a)" font-size="11.5" font-weight="800" text-anchor="middle">8.75% 減 / 2.13% 悪化</text>

  <!-- P2 -->
  <circle cx="430.3" cy="121.2" r="6.5" fill="var(--b)"/>
  <text x="430.3" y="150" fill="var(--fg)" font-size="11.5" font-weight="700" text-anchor="middle">Disk Size（6000.7.0a4）</text>
  <text x="430.3" y="166" fill="var(--b)" font-size="11.5" font-weight="800" text-anchor="middle">21.35% 減 / 4.56% 悪化</text>

  <!-- P3 -->
  <circle cx="544.2" cy="100.5" r="6.5" fill="var(--c)"/>
  <text x="524" y="86" fill="var(--fg)" font-size="11.5" font-weight="700" text-anchor="end">Maximum Size Reduction</text>
  <text x="524" y="102" fill="var(--c)" font-size="11.5" font-weight="800" text-anchor="end">28.50% 減 / 5.25% 悪化</text>

  <text x="320" y="318" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">削減を 8.75% → 28.50% に増やすと、悪化も 2.13% → 5.25% に増える</text>
  <text x="320" y="338" fill="var(--sub)" font-size="11" text-anchor="middle">数値はUnity公式リリースノート（既定 Shorter Build Time との比較）</text>
</svg>
