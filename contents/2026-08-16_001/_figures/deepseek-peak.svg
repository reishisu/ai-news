<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img">

  <!-- 縦のガイド（ピーク帯の境界） -->
  <g stroke="var(--c)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75">
    <line x1="345.8" y1="52" x2="345.8" y2="154"/>
    <line x1="404.6" y1="52" x2="404.6" y2="154"/>
    <line x1="443.8" y1="52" x2="443.8" y2="154"/>
    <line x1="522.1" y1="52" x2="522.1" y2="154"/>
  </g>

  <!-- 行1: ピーク帯 -->
  <text x="375" y="46" fill="var(--c)" font-size="11.5" font-weight="800" text-anchor="middle">10-13時</text>
  <text x="483" y="46" fill="var(--c)" font-size="11.5" font-weight="800" text-anchor="middle">15-19時</text>

  <rect x="150" y="56" width="470" height="34" rx="5" fill="var(--track)"/>
  <rect x="345.8" y="56" width="58.8" height="34" fill="var(--c)"/>
  <rect x="443.8" y="56" width="78.3" height="34" fill="var(--c)"/>
  <rect x="150" y="56" width="470" height="34" rx="5" fill="none" stroke="var(--sub)" stroke-width="1" opacity="0.5"/>

  <text x="140" y="69" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="end">ピーク帯（高い）</text>
  <text x="140" y="86" fill="var(--sub)" font-size="10.5" text-anchor="end">DeepSeek 新料金・計7時間</text>

  <!-- 行2: 業務時間 -->
  <rect x="150" y="116" width="470" height="34" rx="5" fill="var(--track)"/>
  <rect x="326.3" y="116" width="176.3" height="34" fill="var(--b)"/>
  <rect x="150" y="116" width="470" height="34" rx="5" fill="none" stroke="var(--sub)" stroke-width="1" opacity="0.5"/>

  <text x="140" y="129" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="end">日本の業務時間</text>
  <text x="140" y="146" fill="var(--sub)" font-size="10.5" text-anchor="end">9-18時の例・9時間</text>

  <!-- 時刻軸 -->
  <line x1="150" y1="162" x2="620" y2="162" stroke="var(--sub)" stroke-width="1"/>
  <g stroke="var(--sub)" stroke-width="1">
    <line x1="150" y1="162" x2="150" y2="167"/>
    <line x1="208.8" y1="162" x2="208.8" y2="167"/>
    <line x1="267.5" y1="162" x2="267.5" y2="167"/>
    <line x1="326.3" y1="162" x2="326.3" y2="167"/>
    <line x1="385" y1="162" x2="385" y2="167"/>
    <line x1="443.8" y1="162" x2="443.8" y2="167"/>
    <line x1="502.5" y1="162" x2="502.5" y2="167"/>
    <line x1="561.3" y1="162" x2="561.3" y2="167"/>
    <line x1="620" y1="162" x2="620" y2="167"/>
  </g>
  <g fill="var(--sub)" font-size="10.5" text-anchor="middle">
    <text x="150" y="180">0</text>
    <text x="208.8" y="180">3</text>
    <text x="267.5" y="180">6</text>
    <text x="326.3" y="180">9</text>
    <text x="385" y="180">12</text>
    <text x="443.8" y="180">15</text>
    <text x="502.5" y="180">18</text>
    <text x="561.3" y="180">21</text>
    <text x="620" y="180">24</text>
  </g>
  <text x="140" y="180" fill="var(--sub)" font-size="10.5" text-anchor="end">日本時間（時）</text>

  <!-- 結論 -->
  <text x="320" y="212" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">業務時間9時間のうち6時間が、そのままピーク帯に入る</text>
  <text x="320" y="232" fill="var(--sub)" font-size="11.5" text-anchor="middle">日中に残るオフピークは 9-10時 と 13-15時 の3時間だけ</text>
</svg>
