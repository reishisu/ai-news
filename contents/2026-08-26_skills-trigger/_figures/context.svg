<svg viewBox="0 0 640 356" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="10" y="24" font-size="15" font-weight="700" fill="var(--fg)">SKILL.md のうち、常に読まれているのは上の2行だけ</text>

  <!-- 左: ファイルの中身 -->
  <rect x="10" y="42" width="286" height="212" rx="12" fill="var(--track)"/>
  <text x="26" y="66" font-size="13" font-weight="700" fill="var(--fg)">.claude/skills/release-check/SKILL.md</text>

  <rect x="26" y="78" width="254" height="62" rx="8" fill="var(--new)" opacity="0.28"/>
  <text x="36" y="98" font-size="11" font-family="ui-monospace, monospace" fill="var(--fg)">---</text>
  <text x="36" y="115" font-size="11" font-family="ui-monospace, monospace" fill="var(--fg)">description: リリース前の…</text>
  <text x="36" y="132" font-size="11" font-family="ui-monospace, monospace" fill="var(--fg)">---</text>

  <rect x="26" y="148" width="254" height="90" rx="8" fill="var(--old)" opacity="0.5"/>
  <text x="36" y="170" font-size="11" font-family="ui-monospace, monospace" fill="var(--sub)">1. git status が空</text>
  <text x="36" y="189" font-size="11" font-family="ui-monospace, monospace" fill="var(--sub)">2. テストが全部通る</text>
  <text x="36" y="208" font-size="11" font-family="ui-monospace, monospace" fill="var(--sub)">3. バージョンを上げた</text>
  <text x="36" y="230" font-size="11.5" font-weight="700" fill="var(--sub)">← 本文</text>

  <!-- 矢印 -->
  <line x1="300" y1="120" x2="336" y2="120" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="344,120 333,114.6 333,125.4" fill="var(--sub)"/>

  <!-- 右上: 常駐する分 -->
  <rect x="352" y="42" width="278" height="96" rx="12" fill="var(--track)"/>
  <text x="368" y="66" font-size="13" font-weight="700" fill="var(--fg)">会話の文脈に常駐する分</text>
  <rect x="368" y="76" width="246" height="46" rx="8" fill="var(--new)" opacity="0.28"/>
  <text x="378" y="94" font-size="11.5" font-family="ui-monospace, monospace" fill="var(--fg)">release-check</text>
  <text x="378" y="112" font-size="11.5" font-family="ui-monospace, monospace" fill="var(--fg)">リリース前の確認手順を…</text>

  <!-- 右下: 呼ばれるまで載らない -->
  <rect x="352" y="150" width="278" height="104" rx="12" fill="var(--track)"/>
  <text x="368" y="174" font-size="13" font-weight="700" fill="var(--fg)">呼ばれるまで載らない分</text>
  <rect x="368" y="184" width="246" height="54" rx="8" fill="var(--old)" opacity="0.5"/>
  <text x="491" y="216" font-size="12.5" font-weight="700" fill="var(--sub)" text-anchor="middle">本文（何行あっても0円）</text>

  <!-- 下: 判定の流れ -->
  <rect x="10" y="268" width="620" height="78" rx="12" fill="var(--track)"/>
  <text x="26" y="292" font-size="13" font-weight="700" fill="var(--fg)">だから、呼ぶかどうかは上の2行だけで決まる</text>
  <rect x="26" y="302" width="180" height="30" rx="15" fill="var(--b)" opacity="0.85"/>
  <text x="116" y="322" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">質問「リリース前に…」</text>
  <line x1="212" y1="317" x2="246" y2="317" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="254,317 243,311.6 243,322.4" fill="var(--sub)"/>
  <rect x="262" y="302" width="150" height="30" rx="15" fill="var(--new)" opacity="0.9"/>
  <text x="337" y="322" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">名前と説明に照合</text>
  <line x1="418" y1="317" x2="452" y2="317" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="460,317 449,311.6 449,322.4" fill="var(--sub)"/>
  <rect x="468" y="302" width="152" height="30" rx="15" fill="var(--a)" opacity="0.9"/>
  <text x="544" y="322" font-size="12" font-weight="700" fill="var(--bg)" text-anchor="middle">一致したら本文を読む</text>
</svg>
