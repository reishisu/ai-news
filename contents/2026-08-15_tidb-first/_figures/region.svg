<svg viewBox="0 0 640 258" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="20" y="20" fill="var(--fg)" font-size="13.5" font-weight="800">1つのRegionを3つのStoreに複製する</text>

  <!-- 要求元 -->
  <rect x="20" y="60" width="140" height="56" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="90" y="84" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">TiDB server</text>
  <text x="90" y="103" fill="var(--sub)" font-size="11.5" text-anchor="middle">読み書きの要求</text>
  <text x="90" y="136" fill="var(--sub)" font-size="11" text-anchor="middle">Leaderだけが</text>
  <text x="90" y="152" fill="var(--sub)" font-size="11" text-anchor="middle">読み書きを受ける</text>

  <path d="M164 88 L186 88" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Store 1 (Leader) -->
  <rect x="190" y="48" width="130" height="100" rx="10" fill="none" stroke="var(--new)" stroke-width="2"/>
  <text x="255" y="70" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">Store 1</text>
  <rect x="202" y="80" width="106" height="54" rx="8" fill="var(--new)"/>
  <text x="255" y="102" fill="var(--bg)" font-size="12" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region 7</text>
  <text x="255" y="122" fill="var(--bg)" font-size="11.5" font-weight="800" text-anchor="middle">Leader</text>

  <!-- Store 2 -->
  <rect x="340" y="48" width="130" height="100" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="405" y="70" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">Store 2</text>
  <rect x="352" y="80" width="106" height="54" rx="8" fill="var(--old)"/>
  <text x="405" y="102" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region 7</text>
  <text x="405" y="122" fill="var(--fg)" font-size="11.5" font-weight="700" text-anchor="middle">Follower</text>

  <!-- Store 3 -->
  <rect x="490" y="48" width="130" height="100" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.5"/>
  <text x="555" y="70" fill="var(--sub)" font-size="12" text-anchor="middle" font-family="ui-monospace, monospace">Store 3</text>
  <rect x="502" y="80" width="106" height="54" rx="8" fill="var(--old)"/>
  <text x="555" y="102" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region 7</text>
  <text x="555" y="122" fill="var(--fg)" font-size="11.5" font-weight="700" text-anchor="middle">Follower</text>

  <!-- 複製の経路 -->
  <path d="M255 150 L255 174 L555 174" fill="none" stroke="var(--sub)" stroke-width="1.8"/>
  <path d="M405 174 L405 152" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M555 174 L555 152" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="322" y="192" fill="var(--sub)" font-size="11.5" text-anchor="middle">Raftでログを複製</text>

  <!-- 結論 -->
  <rect x="20" y="204" width="600" height="48" rx="10" fill="var(--track)"/>
  <text x="320" y="226" fill="var(--fg)" font-size="12.5" font-weight="800" text-anchor="middle">3つのうち2つ（過半数）に書けた時点で書き込み成功</text>
  <text x="320" y="244" fill="var(--sub)" font-size="11.5" text-anchor="middle">残り1つが遅れても、ユーザーは待たされない</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>
</svg>
