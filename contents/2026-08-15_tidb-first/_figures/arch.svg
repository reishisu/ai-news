<svg viewBox="0 0 640 264" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 見出し -->
  <text x="20" y="22" fill="var(--c)" font-size="13.5" font-weight="800">MySQL — 1プロセスで全部やる</text>
  <text x="260" y="22" fill="var(--b)" font-size="13.5" font-weight="800">TiDB — 役割ごとに別プロセス</text>

  <!-- クライアント -->
  <rect x="20" y="34" width="200" height="36" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="120" y="58" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">クライアント</text>
  <rect x="260" y="34" width="220" height="36" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="370" y="58" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">クライアント</text>

  <!-- 接続 -->
  <path d="M120 72 L120 94" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="128" y="88" fill="var(--sub)" font-size="11.5" font-family="ui-monospace, monospace">port 3306</text>
  <path d="M370 72 L370 94" stroke="var(--b)" stroke-width="1.8" marker-end="url(#arb)"/>
  <text x="378" y="88" fill="var(--b)" font-size="11.5" font-weight="700" font-family="ui-monospace, monospace">port 4000</text>

  <!-- MySQL 本体 -->
  <rect x="20" y="98" width="200" height="112" rx="10" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="120" y="124" fill="var(--fg)" font-size="14" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">mysqld</text>
  <text x="120" y="152" fill="var(--fg)" font-size="12" text-anchor="middle">SQLの解釈</text>
  <text x="120" y="174" fill="var(--fg)" font-size="12" text-anchor="middle">実データの保持</text>
  <text x="120" y="196" fill="var(--fg)" font-size="12" text-anchor="middle">ディスクへ書き込み</text>

  <!-- TiDB server -->
  <rect x="260" y="98" width="220" height="50" rx="10" fill="none" stroke="var(--b)" stroke-width="2"/>
  <text x="370" y="120" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">TiDB server</text>
  <text x="370" y="139" fill="var(--sub)" font-size="11.5" text-anchor="middle">計算だけ・データを持たない</text>

  <path d="M370 150 L370 174" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="378" y="167" fill="var(--sub)" font-size="11">実データの読み書き</text>

  <!-- TiKV -->
  <rect x="260" y="178" width="220" height="50" rx="10" fill="none" stroke="var(--a)" stroke-width="2"/>
  <text x="370" y="200" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">TiKV</text>
  <text x="370" y="219" fill="var(--sub)" font-size="11.5" text-anchor="middle">実データ（キー順に保存）</text>

  <!-- PD -->
  <rect x="500" y="98" width="120" height="130" rx="10" fill="none" stroke="var(--d)" stroke-width="2"/>
  <text x="560" y="120" fill="var(--fg)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">PD</text>
  <text x="560" y="140" fill="var(--sub)" font-size="11.5" text-anchor="middle">司令塔</text>
  <text x="512" y="166" fill="var(--fg)" font-size="11">・時刻(TSO)</text>
  <text x="512" y="186" fill="var(--fg)" font-size="11">・配置の指示</text>
  <text x="512" y="206" fill="var(--fg)" font-size="11">・メタ情報</text>

  <path d="M498 118 L484 118" stroke="var(--d)" stroke-width="1.8" marker-end="url(#ard)"/>
  <path d="M498 200 L484 200" stroke="var(--d)" stroke-width="1.8" marker-end="url(#ard)"/>

  <!-- 下の注記 -->
  <text x="120" y="248" fill="var(--sub)" font-size="11.5" text-anchor="middle">増やすときは1台を強くする</text>
  <text x="370" y="248" fill="var(--sub)" font-size="11.5" text-anchor="middle">SQL層だけ台数を足せる</text>
  <text x="560" y="248" fill="var(--sub)" font-size="11" text-anchor="middle">指示は「提案」</text>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--b)"/>
    </marker>
    <marker id="ard" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--d)"/>
    </marker>
  </defs>
</svg>
