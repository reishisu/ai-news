<svg viewBox="0 0 640 232" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="20" y="20" fill="var(--c)" font-size="13" font-weight="800">AUTO_INCREMENT（連番）</text>
  <text x="340" y="20" fill="var(--a)" font-size="13" font-weight="800">AUTO_RANDOM（ランダム）</text>

  <!-- 新しい行 -->
  <rect x="20" y="32" width="280" height="36" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="160" y="55" fill="var(--fg)" font-size="11.5" text-anchor="middle">新しい行 id＝1001,1002,1003</text>
  <rect x="340" y="32" width="280" height="36" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="480" y="55" fill="var(--fg)" font-size="11.5" text-anchor="middle">新しい行 id＝乱数を含む大きな値</text>

  <!-- 左: すべて末尾へ -->
  <path d="M90 72 L238 110" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arc)"/>
  <path d="M160 72 L252 110" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arc)"/>
  <path d="M230 72 L264 110" stroke="var(--c)" stroke-width="1.8" marker-end="url(#arc)"/>

  <!-- 右: ばらける -->
  <path d="M410 72 L388 110" stroke="var(--a)" stroke-width="1.8" marker-end="url(#ara)"/>
  <path d="M480 72 L480 110" stroke="var(--a)" stroke-width="1.8" marker-end="url(#ara)"/>
  <path d="M550 72 L572 110" stroke="var(--a)" stroke-width="1.8" marker-end="url(#ara)"/>

  <!-- 左のRegion -->
  <rect x="20" y="116" width="80" height="54" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="60" y="140" fill="var(--sub)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">Region A</text>
  <text x="60" y="159" fill="var(--sub)" font-size="11" text-anchor="middle">静か</text>
  <rect x="120" y="116" width="80" height="54" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="160" y="140" fill="var(--sub)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">Region B</text>
  <text x="160" y="159" fill="var(--sub)" font-size="11" text-anchor="middle">静か</text>
  <rect x="220" y="116" width="80" height="54" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2.5"/>
  <text x="260" y="140" fill="var(--c)" font-size="10.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region C</text>
  <text x="260" y="159" fill="var(--c)" font-size="11" font-weight="800" text-anchor="middle">ここに集中</text>

  <!-- 右のRegion -->
  <rect x="340" y="116" width="80" height="54" rx="8" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="380" y="140" fill="var(--a)" font-size="10.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region A</text>
  <text x="380" y="159" fill="var(--sub)" font-size="11" text-anchor="middle">均等</text>
  <rect x="440" y="116" width="80" height="54" rx="8" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="480" y="140" fill="var(--a)" font-size="10.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region B</text>
  <text x="480" y="159" fill="var(--sub)" font-size="11" text-anchor="middle">均等</text>
  <rect x="540" y="116" width="80" height="54" rx="8" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="580" y="140" fill="var(--a)" font-size="10.5" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">Region C</text>
  <text x="580" y="159" fill="var(--sub)" font-size="11" text-anchor="middle">均等</text>

  <!-- まとめ -->
  <text x="160" y="196" fill="var(--c)" font-size="12" font-weight="800" text-anchor="middle">末尾のRegionに書き込みが集中</text>
  <text x="160" y="215" fill="var(--sub)" font-size="11.5" text-anchor="middle">＝ ホットスポット</text>
  <text x="480" y="196" fill="var(--a)" font-size="12" font-weight="800" text-anchor="middle">複数のRegionに散る</text>
  <text x="480" y="215" fill="var(--sub)" font-size="11.5" text-anchor="middle">＝ 書き込みが分散</text>

  <defs>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--c)"/>
    </marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--a)"/>
    </marker>
  </defs>
</svg>
