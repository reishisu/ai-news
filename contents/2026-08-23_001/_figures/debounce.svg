<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--fg)">同じ商品の更新イベントが30秒のうちに4回飛んだとき</text>

  <!-- ===== before ===== -->
  <text x="24" y="60" font-size="14" font-weight="bold" fill="var(--old)">これまで（キュー投入されたリスナー）</text>

  <line x1="24" y1="104" x2="616" y2="104" stroke="var(--track)" stroke-width="3"/>
  <text x="24" y="132" font-size="11" fill="var(--sub)">0秒</text>
  <text x="592" y="132" font-size="11" fill="var(--sub)">30秒</text>

  <g fill="var(--old)">
    <circle cx="80" cy="104" r="8"/><circle cx="210" cy="104" r="8"/>
    <circle cx="330" cy="104" r="8"/><circle cx="470" cy="104" r="8"/>
  </g>
  <text x="80" y="88" text-anchor="middle" font-size="11" fill="var(--sub)">発火</text>
  <text x="210" y="88" text-anchor="middle" font-size="11" fill="var(--sub)">発火</text>
  <text x="330" y="88" text-anchor="middle" font-size="11" fill="var(--sub)">発火</text>
  <text x="470" y="88" text-anchor="middle" font-size="11" fill="var(--sub)">発火</text>

  <rect x="24" y="142" width="592" height="34" rx="8" fill="var(--track)" stroke="var(--old)" stroke-width="2"/>
  <text x="320" y="164" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--fg)">検索インデックスの更新が 4回 走る</text>

  <line x1="24" y1="196" x2="616" y2="196" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== after ===== -->
  <text x="24" y="224" font-size="14" font-weight="bold" fill="var(--new)">v13.26.0 から　#[DebounceFor(30)]</text>

  <line x1="24" y1="268" x2="616" y2="268" stroke="var(--track)" stroke-width="3"/>
  <g fill="var(--new)">
    <circle cx="80" cy="268" r="8"/><circle cx="210" cy="268" r="8"/>
    <circle cx="330" cy="268" r="8"/><circle cx="470" cy="268" r="8"/>
  </g>
  <path d="M80 268 L462 268" stroke="var(--new)" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <path d="M470 268 l-11 -6 l0 12 z" fill="var(--new)"/>
  <text x="265" y="252" text-anchor="middle" font-size="11" fill="var(--sub)">最後の発火まで先送りされる</text>

  <rect x="24" y="292" width="592" height="34" rx="8" fill="var(--new)"/>
  <text x="320" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">最後の1回だけ走る（debounceId が同じものどうしで）</text>
</svg>
