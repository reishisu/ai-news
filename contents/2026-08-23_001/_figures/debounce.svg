<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 300" font-family="sans-serif">
  <text x="230" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--fg)">同じイベントが30秒に4回飛んだとき</text>

  <!-- before -->
  <text x="16" y="62" font-size="16" font-weight="bold" fill="var(--sub)">これまで</text>

  <line x1="16" y1="94" x2="444" y2="94" stroke="var(--track)" stroke-width="4"/>
  <g fill="var(--old)">
    <circle cx="70" cy="94" r="9"/><circle cx="170" cy="94" r="9"/>
    <circle cx="265" cy="94" r="9"/><circle cx="380" cy="94" r="9"/>
  </g>
  <text x="16" y="82" font-size="14" fill="var(--sub)">発火</text>

  <rect x="16" y="112" width="428" height="38" rx="9" fill="var(--track)" stroke="var(--old)" stroke-width="2"/>
  <text x="230" y="137" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--fg)">更新が 4回 走る</text>

  <line x1="16" y1="172" x2="444" y2="172" stroke="var(--sub)" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- after -->
  <text x="16" y="200" font-size="16" font-weight="bold" fill="var(--new)">#[DebounceFor(30)] を付けると</text>

  <line x1="16" y1="232" x2="444" y2="232" stroke="var(--track)" stroke-width="4"/>
  <g fill="var(--new)">
    <circle cx="70" cy="232" r="9"/><circle cx="170" cy="232" r="9"/>
    <circle cx="265" cy="232" r="9"/><circle cx="380" cy="232" r="9"/>
  </g>
  <path d="M70 232 L366 232" stroke="var(--new)" stroke-width="4" stroke-dasharray="7 6" fill="none"/>
  <path d="M380 232 l-13 -7 l0 14 z" fill="var(--new)"/>
  <text x="16" y="220" font-size="14" fill="var(--sub)">最後まで先送り</text>

  <rect x="16" y="250" width="428" height="38" rx="9" fill="var(--new)"/>
  <text x="230" y="275" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">最後の1回だけ走る</text>
</svg>
