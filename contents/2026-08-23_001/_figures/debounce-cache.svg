<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="sans-serif">
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--fg)">ECS on Fargate で2タスク動かしているとき、どこに数えさせるか</text>

  <!-- NG -->
  <text x="24" y="60" font-size="14" font-weight="bold" fill="var(--old)">✕ タスクごとのキャッシュ（file / array など）</text>

  <rect x="24" y="74" width="180" height="62" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="114" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--fg)">タスク A</text>
  <text x="114" y="118" text-anchor="middle" font-size="11" fill="var(--sub)">自分の中だけで数える</text>

  <rect x="230" y="74" width="180" height="62" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="320" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--fg)">タスク B</text>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="var(--sub)">自分の中だけで数える</text>

  <rect x="436" y="74" width="180" height="62" rx="8" fill="var(--old)"/>
  <text x="526" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">まとめられない</text>
  <text x="526" y="118" text-anchor="middle" font-size="11" fill="#ffffff">タスクの数だけ走る</text>

  <line x1="24" y1="164" x2="616" y2="164" stroke="var(--sub)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- OK -->
  <text x="24" y="192" font-size="14" font-weight="bold" fill="var(--new)">○ 共通のキャッシュを1つ指す（redis など）</text>

  <rect x="24" y="206" width="180" height="56" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="114" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--fg)">タスク A</text>

  <rect x="230" y="206" width="180" height="56" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="320" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="var(--fg)">タスク B</text>

  <path d="M114 262 L114 280 L320 280 L320 292" stroke="var(--new)" stroke-width="3" fill="none"/>
  <path d="M320 262 L320 280" stroke="var(--new)" stroke-width="3" fill="none"/>
  <path d="M320 300 l-6 -11 l12 0 z" fill="var(--new)"/>

  <rect x="236" y="300" width="168" height="46" rx="8" fill="var(--new)"/>
  <text x="320" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">共通のキャッシュ</text>
  <text x="320" y="337" text-anchor="middle" font-size="11" fill="#ffffff">ここで1本に数える</text>

  <text x="430" y="325" font-size="12" font-weight="bold" fill="var(--new)">→ 全体で最後の1回だけ</text>
</svg>
