<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" font-family="sans-serif">
  <text x="230" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--fg)">2タスク動かすとき、どこで数えるか</text>

  <!-- NG -->
  <text x="16" y="60" font-size="16" font-weight="bold" fill="var(--sub)">✕ タスクごとのキャッシュ</text>

  <rect x="16" y="74" width="130" height="52" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="81" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--fg)">タスク A</text>

  <rect x="156" y="74" width="130" height="52" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="221" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--fg)">タスク B</text>

  <rect x="296" y="74" width="148" height="52" rx="9" fill="var(--old)"/>
  <text x="370" y="97" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">別々に数える</text>
  <text x="370" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">→ 2回走る</text>

  <line x1="16" y1="148" x2="444" y2="148" stroke="var(--sub)" stroke-width="1" stroke-dasharray="5 5"/>

  <!-- OK -->
  <text x="16" y="176" font-size="16" font-weight="bold" fill="var(--new)">○ 共通のキャッシュを1つ指す</text>

  <rect x="16" y="190" width="130" height="48" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="81" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--fg)">タスク A</text>

  <rect x="156" y="190" width="130" height="48" rx="9" fill="var(--track)" stroke="var(--sub)" stroke-width="2"/>
  <text x="221" y="220" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--fg)">タスク B</text>

  <path d="M81 238 L81 254 L151 254 L151 264" stroke="var(--new)" stroke-width="3" fill="none"/>
  <path d="M221 238 L221 254 L151 254" stroke="var(--new)" stroke-width="3" fill="none"/>
  <path d="M151 272 l-7 -12 l14 0 z" fill="var(--new)"/>

  <rect x="16" y="272" width="270" height="34" rx="9" fill="var(--new)"/>
  <text x="151" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">共通のキャッシュで1本に</text>

  <text x="298" y="288" font-size="15" font-weight="bold" fill="var(--new)">→ 全体で</text>
  <text x="298" y="305" font-size="15" font-weight="bold" fill="var(--new)">　1回だけ</text>
</svg>
