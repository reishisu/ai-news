<svg viewBox="0 0 400 372" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>

  <rect x="90" y="6" width="300" height="46" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="1.4"/>
  <text x="240" y="26" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--fg)">Q1　その指摘の合否は、</text>
  <text x="240" y="44" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--fg)">コードだけを見て決まるか</text>

  <path d="M130 52 L130 64" fill="none" stroke="var(--c)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="138" y="62" font-size="12.5" font-weight="800" fill="var(--c)">いいえ</text>
  <rect x="10" y="66" width="250" height="36" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2.5"/>
  <text x="24" y="89" font-size="13.5" font-weight="800" fill="var(--c)">人が読む（仕様・権限・境界）</text>

  <path d="M350 52 L350 108" fill="none" stroke="var(--b)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="344" y="84" text-anchor="end" font-size="12.5" font-weight="800" fill="var(--b)">はい</text>

  <rect x="90" y="112" width="300" height="46" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="1.4"/>
  <text x="240" y="132" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--fg)">Q2　既製のツールに、</text>
  <text x="240" y="150" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--fg)">同じルールが既にあるか</text>

  <path d="M130 158 L130 170" fill="none" stroke="var(--b)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="138" y="168" font-size="12.5" font-weight="800" fill="var(--b)">はい</text>
  <rect x="10" y="172" width="250" height="36" rx="8" fill="var(--track)" stroke="var(--b)" stroke-width="2"/>
  <text x="24" y="195" font-size="13.5" font-weight="800" fill="var(--b)">既製ツールをCIへ</text>

  <path d="M350 158 L350 214" fill="none" stroke="var(--c)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="344" y="190" text-anchor="end" font-size="12.5" font-weight="800" fill="var(--c)">いいえ</text>

  <rect x="90" y="218" width="300" height="46" rx="8" fill="var(--track)" stroke="var(--sub)" stroke-width="1.4"/>
  <text x="240" y="238" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--fg)">Q3　合否の条件を、</text>
  <text x="240" y="256" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--fg)">1文の規約として書けるか</text>

  <path d="M130 264 L130 276" fill="none" stroke="var(--c)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="138" y="274" font-size="12.5" font-weight="800" fill="var(--c)">いいえ</text>
  <rect x="10" y="278" width="250" height="36" rx="8" fill="var(--track)" stroke="var(--c)" stroke-width="2.5"/>
  <text x="24" y="301" font-size="13.5" font-weight="800" fill="var(--c)">人が読む（規約が決まるまで）</text>

  <path d="M350 264 L350 320" fill="none" stroke="var(--a)" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="344" y="296" text-anchor="end" font-size="12.5" font-weight="800" fill="var(--a)">はい</text>

  <rect x="90" y="324" width="300" height="40" rx="8" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="240" y="349" text-anchor="middle" font-size="13.5" font-weight="800" fill="var(--a)">自作ルールを書いてCIへ</text>
</svg>
