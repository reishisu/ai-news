<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img">
<g font-family="'Noto Sans JP','IPAGothic','DejaVu Sans',sans-serif">

  <text x="36" y="28" font-size="17" font-weight="700" fill="var(--fg)">切り抜きは4段。どの段も、消してはいけないものを消した</text>

  <!-- 元画像 -->
  <rect x="36" y="44" width="340" height="50" rx="12" fill="var(--track)"/>
  <text x="56" y="68" font-size="15.5" font-weight="700" fill="var(--fg)">元画像（ComfyUIで生成）</text>
  <text x="56" y="87" font-size="13.5" fill="var(--sub)">832×1216・黒背景 ／ 5人×16ポーズ＝80枚</text>
  <line x1="206" y1="94" x2="206" y2="106" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="206,112 200.6,101 211.4,101" fill="var(--sub)"/>

  <text x="404" y="106" font-size="14" font-weight="700" fill="var(--c)">この段で起きた事故</text>

  <!-- 1 -->
  <rect x="36" y="112" width="340" height="46" rx="11" fill="var(--track)"/>
  <circle cx="60" cy="135" r="13" fill="var(--new)"/>
  <text x="60" y="140" font-size="14" font-weight="700" fill="var(--bg)" text-anchor="middle">1</text>
  <text x="82" y="132" font-size="15.5" font-weight="700" fill="var(--fg)">rembg で切り抜く</text>
  <text x="82" y="150" font-size="13" fill="var(--sub)">birefnet-general-lite</text>
  <line x1="376" y1="135" x2="396" y2="135" stroke="var(--c)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="404" cy="135" r="4" fill="var(--c)"/>
  <text x="416" y="140" font-size="15" font-weight="700" fill="var(--c)">ツインテールごと消える</text>
  <line x1="206" y1="158" x2="206" y2="168" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="206,174 200.6,163 211.4,163" fill="var(--sub)"/>

  <!-- 2 -->
  <rect x="36" y="174" width="340" height="46" rx="11" fill="var(--track)"/>
  <circle cx="60" cy="197" r="13" fill="var(--new)"/>
  <text x="60" y="202" font-size="14" font-weight="700" fill="var(--bg)" text-anchor="middle">2</text>
  <text x="82" y="194" font-size="15.5" font-weight="700" fill="var(--fg)">縁の掃除</text>
  <text x="82" y="212" font-size="13" fill="var(--sub)">暗い画素をたどって黒の残りを消す</text>
  <line x1="376" y1="197" x2="396" y2="197" stroke="var(--c)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="404" cy="197" r="4" fill="var(--c)"/>
  <text x="416" y="202" font-size="15" font-weight="700" fill="var(--c)">影と黒いズボンを食う</text>
  <line x1="206" y1="220" x2="206" y2="230" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="206,236 200.6,225 211.4,225" fill="var(--sub)"/>

  <!-- 3 -->
  <rect x="36" y="236" width="340" height="46" rx="11" fill="var(--track)"/>
  <circle cx="60" cy="259" r="13" fill="var(--new)"/>
  <text x="60" y="264" font-size="14" font-weight="700" fill="var(--bg)" text-anchor="middle">3</text>
  <text x="82" y="256" font-size="15.5" font-weight="700" fill="var(--fg)">浮遊物の除去</text>
  <text x="82" y="274" font-size="13" fill="var(--sub)">本体から離れた小さい塊を消す</text>
  <line x1="376" y1="259" x2="396" y2="259" stroke="var(--c)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="404" cy="259" r="4" fill="var(--c)"/>
  <text x="416" y="264" font-size="15" font-weight="700" fill="var(--c)">切れた髪を捨てる</text>
  <line x1="206" y1="282" x2="206" y2="292" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="206,298 200.6,287 211.4,287" fill="var(--sub)"/>

  <!-- 4 -->
  <rect x="36" y="298" width="340" height="46" rx="11" fill="var(--track)"/>
  <circle cx="60" cy="321" r="13" fill="var(--new)"/>
  <text x="60" y="326" font-size="14" font-weight="700" fill="var(--bg)" text-anchor="middle">4</text>
  <text x="82" y="318" font-size="15.5" font-weight="700" fill="var(--fg)">欠けの補完</text>
  <text x="82" y="336" font-size="13" fill="var(--sub)">isnet-anime で消えた本体を戻す</text>
  <line x1="376" y1="321" x2="396" y2="321" stroke="var(--c)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="404" cy="321" r="4" fill="var(--c)"/>
  <text x="416" y="326" font-size="15" font-weight="700" fill="var(--c)">戻した髪が真っ黒になる</text>
  <line x1="206" y1="344" x2="206" y2="354" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="206,360 200.6,349 211.4,349" fill="var(--sub)"/>

  <!-- 出来上がり -->
  <rect x="36" y="360" width="340" height="46" rx="11" fill="var(--a)" opacity="0.9"/>
  <text x="56" y="380" font-size="15.5" font-weight="700" fill="var(--bg)">透過PNG</text>
  <text x="56" y="398" font-size="13" fill="var(--bg)" opacity="0.9">80枚を切り直した（1枚18〜28秒）</text>
  <line x1="376" y1="383" x2="398" y2="383" stroke="var(--sub)" stroke-width="2.5"/>
  <polygon points="406,383 395,377.6 395,388.4" fill="var(--sub)"/>
  <rect x="414" y="360" width="230" height="46" rx="23" fill="var(--track)"/>
  <text x="529" y="389" font-size="15" font-weight="700" fill="var(--fg)" text-anchor="middle">サイトのサムネイルへ</text>

</g>
</svg>
