<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg">
<g font-family="'Noto Sans JP','IPAGothic','DejaVu Sans',sans-serif">
  <text x="10" y="24" font-size="20" font-weight="bold" fill="var(--fg)">諦めてもサーバーは描き続ける</text>
  <text x="10" y="46" font-size="16" fill="var(--sub)">ComfyUIのワーカーは1本。投げた順に描く</text>
  <text x="10" y="78" font-size="18" font-weight="bold" fill="var(--fg)">旧: 諦めるだけ</text>
  <text x="120" y="102" font-size="16" fill="var(--c)">↓ここで諦める</text>
  <line x1="124" y1="106" x2="124" y2="116" stroke="var(--c)" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="10" y="116" width="112" height="34" rx="7" fill="var(--new)"/>
  <text x="66" y="139" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">A（重い）</text>
  <rect x="126" y="116" width="182" height="34" rx="7" fill="var(--c)" fill-opacity="0.28"/>
  <text x="217" y="139" font-size="16" fill="var(--fg)" text-anchor="middle">Aを描き続ける</text>
  <rect x="312" y="116" width="66" height="34" rx="7" fill="var(--old)"/>
  <text x="345" y="139" font-size="17" fill="var(--fg)" text-anchor="middle">B</text>
  <rect x="382" y="116" width="66" height="34" rx="7" fill="var(--old)"/>
  <text x="415" y="139" font-size="17" fill="var(--fg)" text-anchor="middle">C</text>
  <text x="10" y="174" font-size="17" fill="var(--c)">BもCも、Aが終わるまで動けない</text>
  <text x="10" y="212" font-size="18" font-weight="bold" fill="var(--fg)">新: 諦めるときに降ろす</text>
  <text x="120" y="236" font-size="16" fill="var(--a)">↓ここで降ろす</text>
  <line x1="124" y1="240" x2="124" y2="250" stroke="var(--a)" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="10" y="250" width="112" height="34" rx="7" fill="var(--new)"/>
  <text x="66" y="273" font-size="17" font-weight="bold" fill="var(--bg)" text-anchor="middle">A（重い）</text>
  <rect x="126" y="250" width="66" height="34" rx="7" fill="var(--new)" fill-opacity="0.75"/>
  <text x="159" y="273" font-size="17" fill="var(--bg)" text-anchor="middle">B</text>
  <rect x="196" y="250" width="66" height="34" rx="7" fill="var(--new)" fill-opacity="0.75"/>
  <text x="229" y="273" font-size="17" fill="var(--bg)" text-anchor="middle">C</text>
  <rect x="266" y="250" width="182" height="34" rx="7" fill="none" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="357" y="273" font-size="16" fill="var(--a)" text-anchor="middle">描かずに済んだ時間</text>
  <text x="10" y="308" font-size="17" fill="var(--a)">次のBがすぐ走る</text>
</g>
</svg>
