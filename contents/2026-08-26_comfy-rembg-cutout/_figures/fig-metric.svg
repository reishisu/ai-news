<svg viewBox="0 0 460 348" xmlns="http://www.w3.org/2000/svg">
<g font-family="'Noto Sans JP','IPAGothic','DejaVu Sans',sans-serif">
  <text x="10" y="24" font-size="20" font-weight="bold" fill="var(--fg)">指標は「明るい×消えた」しか見ない</text>
  <text x="106" y="56" font-size="16" fill="var(--sub)">消えた（透明）</text>
  <text x="290" y="56" font-size="16" fill="var(--sub)">残った（不透明）</text>
  <text x="10" y="118" font-size="16" fill="var(--sub)">元画像が</text>
  <text x="10" y="138" font-size="16" fill="var(--sub)">明るい</text>
  <text x="10" y="222" font-size="16" fill="var(--sub)">元画像が</text>
  <text x="10" y="242" font-size="16" fill="var(--sub)">暗い</text>
  <rect x="90" y="68" width="176" height="88" rx="10" fill="var(--track)"/>
  <text x="178" y="102" font-size="18" font-weight="bold" fill="var(--fg)" text-anchor="middle">測っていた欠け</text>
  <text x="178" y="130" font-size="15" fill="var(--sub)" text-anchor="middle">ツインテール・袖・手</text>
  <rect x="274" y="68" width="176" height="88" rx="10" fill="var(--track)"/>
  <text x="362" y="102" font-size="18" font-weight="bold" fill="var(--fg)" text-anchor="middle">正常</text>
  <text x="362" y="130" font-size="15" fill="var(--sub)" text-anchor="middle">本体が残っている</text>
  <rect x="90" y="172" width="176" height="88" rx="10" fill="var(--c)" fill-opacity="0.16" stroke="var(--c)" stroke-width="3"/>
  <text x="178" y="206" font-size="18" font-weight="bold" fill="var(--c)" text-anchor="middle">見えていなかった</text>
  <text x="178" y="234" font-size="15" fill="var(--fg)" text-anchor="middle">影・黒い服・線画</text>
  <rect x="274" y="172" width="176" height="88" rx="10" fill="var(--track)"/>
  <text x="362" y="206" font-size="18" font-weight="bold" fill="var(--fg)" text-anchor="middle">取り残し</text>
  <text x="362" y="234" font-size="15" fill="var(--sub)" text-anchor="middle">囲まれた背景</text>
  <rect x="10" y="284" width="6" height="52" fill="var(--c)"/>
  <text x="28" y="306" font-size="18" font-weight="bold" fill="var(--fg)">指標が見ていない損傷は、</text>
  <text x="28" y="330" font-size="18" font-weight="bold" fill="var(--fg)">存在しないことになる</text>
</g>
</svg>
