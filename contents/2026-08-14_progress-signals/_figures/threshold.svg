<svg viewBox="0 0 640 290" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 目盛り: 0分=150px, 180分=560px -->

  <!-- ===== 上段: 7日 決め打ち ===== -->
  <text x="14" y="76" fill="var(--fg)" font-size="13" font-weight="800">7日 決め打ち</text>
  <text x="14" y="94" fill="var(--sub)" font-size="12.5">他所のスクリプト由来</text>

  <text x="626" y="44" fill="var(--sub)" font-size="12.5" text-anchor="end">しきい値 7日 = 10080分（図の右外）</text>

  <rect x="150" y="58" width="380" height="30" rx="6" fill="var(--old)"/>
  <text x="340" y="78" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">静止 2h47m</text>
  <text x="536" y="78" fill="var(--c)" font-size="13" font-weight="800">7日 の 0.02倍</text>
  <text x="626" y="112" fill="var(--c)" font-size="13" font-weight="800" text-anchor="end">検出 0件 ／ 未統合 1件</text>

  <!-- ===== 下段: 履歴から出したSLE ===== -->
  <text x="14" y="176" fill="var(--fg)" font-size="13" font-weight="800">SLE 43分</text>
  <text x="14" y="194" fill="var(--sub)" font-size="12.5">履歴27件の85%点</text>

  <text x="248" y="134" fill="var(--a)" font-size="13.5" font-weight="800" text-anchor="middle">SLE 43分</text>

  <rect x="150" y="158" width="380" height="30" rx="6" fill="var(--old)"/>
  <line x1="248" y1="140" x2="248" y2="234" stroke="var(--a)" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="340" y="178" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">静止 2h47m</text>
  <text x="536" y="178" fill="var(--a)" font-size="13" font-weight="800">SLE の 3.8倍</text>
  <text x="626" y="212" fill="var(--a)" font-size="13" font-weight="800" text-anchor="end">要確認 1件 ／ 検査 1件</text>

  <!-- ===== 軸 ===== -->
  <line x1="150" y1="234" x2="568" y2="234" stroke="var(--sub)" stroke-width="1"/>
  <line x1="150" y1="234" x2="150" y2="240" stroke="var(--sub)" stroke-width="1"/>
  <line x1="287" y1="234" x2="287" y2="240" stroke="var(--sub)" stroke-width="1"/>
  <line x1="423" y1="234" x2="423" y2="240" stroke="var(--sub)" stroke-width="1"/>
  <line x1="560" y1="234" x2="560" y2="240" stroke="var(--sub)" stroke-width="1"/>
  <text x="150" y="256" fill="var(--sub)" font-size="12.5" text-anchor="middle">0</text>
  <text x="287" y="256" fill="var(--sub)" font-size="12.5" text-anchor="middle">1時間</text>
  <text x="423" y="256" fill="var(--sub)" font-size="12.5" text-anchor="middle">2時間</text>
  <text x="560" y="256" fill="var(--sub)" font-size="12.5" text-anchor="middle">3時間</text>
  <text x="626" y="276" fill="var(--sub)" font-size="12.5" text-anchor="end">同じ枝・同じ瞬間・違うしきい値</text>
</svg>
