<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img">

  <!-- ===== 上段: 完了したもの ===== -->
  <text x="14" y="28" fill="var(--fg)" font-size="13.5" font-weight="800">完了したものだけが Cycle Time を持つ</text>
  <text x="626" y="46" fill="var(--sub)" font-size="12.5" text-anchor="end">● = 完了</text>

  <rect x="70" y="44"  width="50"  height="11" rx="5" fill="var(--old)"/>
  <circle cx="120" cy="49.5" r="4" fill="var(--sub)"/>
  <rect x="70" y="61"  width="70"  height="11" rx="5" fill="var(--old)"/>
  <circle cx="140" cy="66.5" r="4" fill="var(--sub)"/>
  <rect x="70" y="78"  width="90"  height="11" rx="5" fill="var(--old)"/>
  <circle cx="160" cy="83.5" r="4" fill="var(--sub)"/>
  <rect x="70" y="95"  width="130" height="11" rx="5" fill="var(--old)"/>
  <circle cx="200" cy="100.5" r="4" fill="var(--sub)"/>
  <rect x="70" y="112" width="160" height="11" rx="5" fill="var(--old)"/>
  <circle cx="230" cy="117.5" r="4" fill="var(--sub)"/>
  <rect x="70" y="129" width="240" height="11" rx="5" fill="var(--old)"/>
  <circle cx="310" cy="134.5" r="4" fill="var(--sub)"/>
  <rect x="70" y="146" width="330" height="11" rx="5" fill="var(--old)"/>
  <circle cx="400" cy="151.5" r="4" fill="var(--sub)"/>

  <!-- 85%点 -->
  <line x1="310" y1="38" x2="310" y2="166" stroke="var(--b)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="318" y="100" fill="var(--b)" font-size="13" font-weight="800">85%点 = SLE</text>
  <text x="318" y="122" fill="var(--sub)" font-size="12.5">Throughput / Cycle Time は</text>
  <text x="318" y="140" fill="var(--sub)" font-size="12.5">完了した側でしか数えられない</text>

  <!-- 受け渡し -->
  <line x1="310" y1="166" x2="310" y2="192" stroke="var(--b)" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="304,192 316,192 310,202" fill="var(--b)"/>
  <text x="318" y="186" fill="var(--sub)" font-size="12.5">この線をしきい値にする</text>

  <!-- ===== 下段: 未完了 ===== -->
  <text x="14" y="228" fill="var(--fg)" font-size="13.5" font-weight="800">未完了は「経過時間」しか測れない</text>
  <text x="626" y="228" fill="var(--sub)" font-size="12.5" text-anchor="end">▶ はまだ伸びる</text>

  <line x1="310" y1="242" x2="310" y2="348" stroke="var(--b)" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="70" y="246" width="110" height="24" rx="6" fill="var(--old)"/>
  <polygon points="180,246 194,258 180,270" fill="var(--old)"/>
  <text x="212" y="264" fill="var(--sub)" font-size="13">まだ SLE 内</text>

  <rect x="70" y="282" width="270" height="24" rx="6" fill="var(--c)"/>
  <polygon points="340,282 354,294 340,306" fill="var(--c)"/>
  <text x="364" y="300" fill="var(--c)" font-size="13" font-weight="800">要確認</text>

  <rect x="70" y="318" width="400" height="24" rx="6" fill="var(--c)"/>
  <polygon points="470,318 484,330 470,342" fill="var(--c)"/>
  <text x="494" y="336" fill="var(--c)" font-size="13" font-weight="800">要確認</text>

  <text x="310" y="368" fill="var(--b)" font-size="13" font-weight="800" text-anchor="middle">SLE = 85%点（例: 85%が8日以内）</text>
</svg>
