<svg viewBox="0 0 640 336" xmlns="http://www.w3.org/2000/svg" role="img">

  <text x="320" y="24" fill="var(--fg)" font-size="13.5" font-weight="800" text-anchor="middle">8月11日と12日に何が出たか — WebViewの番号はChromeと同じ</text>

  <!-- 日付の見出し -->
  <rect x="176" y="42" width="128" height="24" rx="12" fill="var(--track)"/>
  <text x="240" y="58.5" fill="var(--fg)" font-size="12" font-weight="700" text-anchor="middle">2026年8月11日</text>
  <rect x="436" y="42" width="128" height="24" rx="12" fill="var(--track)"/>
  <text x="500" y="58.5" fill="var(--fg)" font-size="12" font-weight="700" text-anchor="middle">2026年8月12日</text>

  <!-- 区切り線 -->
  <line x1="110" y1="36" x2="110" y2="280" stroke="var(--track)" stroke-width="1.5"/>
  <line x1="370" y1="36" x2="370" y2="280" stroke="var(--track)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="8" y1="176" x2="628" y2="176" stroke="var(--track)" stroke-width="1.5"/>

  <!-- レーン名 -->
  <text x="58" y="118" fill="var(--sub)" font-size="12" font-weight="800" text-anchor="middle">Chrome</text>
  <text x="58" y="226" fill="var(--sub)" font-size="12" font-weight="800" text-anchor="middle">WebView</text>

  <!-- Chrome / 8月11日 -->
  <rect x="120" y="80" width="240" height="84" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.4"/>
  <text x="240" y="110" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle">Chrome 151.0.7922.137 安定版</text>
  <text x="240" y="131" fill="var(--sub)" font-size="11" text-anchor="middle">デスクトップ / Android 同日</text>
  <text x="240" y="152" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">セキュリティ修正5件 すべてHigh</text>
  <rect x="304" y="70" width="46" height="20" rx="10" fill="var(--track)"/>
  <text x="327" y="84.5" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle">151</text>

  <!-- Chrome / 8月12日 -->
  <rect x="380" y="80" width="240" height="84" rx="10" fill="none" stroke="var(--new)" stroke-width="1.8"/>
  <text x="500" y="110" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle">Chrome for Android 152</text>
  <text x="500" y="131" fill="var(--sub)" font-size="11" text-anchor="middle">152.0.7977.42 / early stable</text>
  <text x="500" y="152" fill="var(--d)" font-size="11.5" font-weight="700" text-anchor="middle">一部ユーザーのみに配信</text>
  <rect x="564" y="70" width="46" height="20" rx="10" fill="var(--new)"/>
  <text x="587" y="84.5" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">152</text>

  <!-- WebView / 8月11日 -->
  <rect x="120" y="188" width="240" height="84" rx="10" fill="none" stroke="var(--track)" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="240" y="226" fill="var(--sub)" font-size="11" text-anchor="middle">WebViewの新規リリースなし</text>
  <text x="240" y="246" fill="var(--sub)" font-size="10.5" text-anchor="middle">v151（2026-07-15）のまま</text>

  <!-- WebView / 8月12日 -->
  <rect x="380" y="188" width="240" height="84" rx="10" fill="none" stroke="var(--new)" stroke-width="1.8"/>
  <text x="500" y="218" fill="var(--fg)" font-size="12" font-weight="800" text-anchor="middle">Android System WebView v152</text>
  <text x="500" y="239" fill="var(--sub)" font-size="11" text-anchor="middle">リリースノートは定型文のみ</text>
  <text x="500" y="260" fill="var(--c)" font-size="11.5" font-weight="700" text-anchor="middle">個別の変更点の記載ゼロ</text>
  <rect x="564" y="178" width="46" height="20" rx="10" fill="var(--new)"/>
  <text x="587" y="192.5" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">152</text>

  <text x="320" y="302" fill="var(--fg)" font-size="12.5" font-weight="700" text-anchor="middle">WebViewのノートが空でも、同じ番号のChrome側に手がかりがある</text>
  <text x="320" y="322" fill="var(--sub)" font-size="11" text-anchor="middle">出典: Chrome Releases と Android WebView Release Notes</text>
</svg>
