<svg viewBox="0 0 460 352" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="14" y="30" font-size="26" font-weight="700" fill="var(--fg)">見るのは1か所だけ</text>

  <g data-step="1">
    <rect x="14" y="46" width="432" height="50" rx="10" fill="var(--track)"/>
    <text x="230" y="78" font-size="19" font-weight="700" fill="var(--fg)" text-anchor="middle">設定 › システム › バージョン情報</text>
  </g>

  <g data-step="2">
    <line x1="230" y1="100" x2="230" y2="118" stroke="var(--sub)" stroke-width="3"/>
    <polygon points="230,128 224,116 236,116" fill="var(--sub)"/>
    <rect x="14" y="134" width="210" height="46" rx="10" fill="var(--track)"/>
    <text x="119" y="164" font-size="21" font-weight="700" fill="var(--fg)" text-anchor="middle">25H2 か 26H1</text>
    <rect x="236" y="134" width="210" height="46" rx="10" fill="var(--track)"/>
    <text x="341" y="164" font-size="21" font-weight="700" fill="var(--fg)" text-anchor="middle">24H2</text>
  </g>

  <g data-step="3">
    <rect x="14" y="196" width="210" height="76" rx="10" fill="var(--a)"/>
    <text x="119" y="228" font-size="23" font-weight="700" fill="#ffffff" text-anchor="middle">何もしない</text>
    <text x="119" y="254" font-size="16" fill="#ffffff" text-anchor="middle">期限は1年以上先</text>
  </g>

  <g data-step="4">
    <rect x="236" y="196" width="210" height="76" rx="10" fill="var(--old)"/>
    <text x="341" y="228" font-size="19" font-weight="700" fill="var(--fg)" text-anchor="middle">待つか、押す</text>
    <text x="341" y="254" font-size="15" fill="var(--fg)" text-anchor="middle">更新プログラムのチェック</text>
  </g>

  <g data-step="5">
    <text x="14" y="308" font-size="20" font-weight="700" fill="var(--fg)">24H2でも自動で25H2が届く</text>
    <text x="14" y="334" font-size="15" fill="var(--sub)">押すのは、待ちたくないときだけ</text>
  </g>
</svg>
