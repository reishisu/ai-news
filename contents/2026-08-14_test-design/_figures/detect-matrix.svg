  <text x="268" y="170" fill="var(--sub)" font-size="13.5" font-weight="700" text-anchor="middle">素通り</text>
  <text x="268" y="186" fill="var(--sub)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">12P</text>
