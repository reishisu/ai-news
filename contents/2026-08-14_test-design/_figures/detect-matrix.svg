  <text x="414" y="30" fill="var(--sub)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">intg</text>
  <text x="560" y="30" fill="var(--sub)" font-size="13" font-weight="800" text-anchor="middle" font-family="ui-monospace, monospace">e2e</text>

  <!-- b1 -->
