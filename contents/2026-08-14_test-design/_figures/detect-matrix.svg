  <text x="268" y="116" fill="var(--sub)" font-size="13.5" font-weight="700" text-anchor="middle">素通り</text>
  <text x="268" y="132" fill="var(--sub)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">12P</text>
  <rect x="344" y="96" width="140" height="46" rx="8" fill="var(--new)"/>
  <text x="414" y="116" fill="var(--bg)" font-size="13.5" font-weight="800" text-anchor="middle">検出</text>
  <text x="414" y="132" fill="var(--bg)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">2F/4</text>
  <rect x="490" y="96" width="140" height="46" rx="8" fill="var(--new)"/>
