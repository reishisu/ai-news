  <text x="14" y="79" fill="var(--sub)" font-size="11">割引の境界を1席ズラす</text>
  <rect x="198" y="42" width="140" height="46" rx="8" fill="var(--new)"/>
  <text x="268" y="62" fill="var(--bg)" font-size="13.5" font-weight="800" text-anchor="middle">検出</text>
  <text x="268" y="78" fill="var(--bg)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">2F/12</text>
  <rect x="344" y="42" width="140" height="46" rx="8" fill="var(--track)"/>
  <text x="414" y="62" fill="var(--sub)" font-size="13.5" font-weight="700" text-anchor="middle">素通り</text>
  <text x="414" y="78" fill="var(--sub)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">4P</text>
  <rect x="490" y="42" width="140" height="46" rx="8" fill="var(--track)"/>
