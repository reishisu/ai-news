  <text x="268" y="240" fill="var(--bg)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">5F/12</text>
  <rect x="344" y="204" width="140" height="46" rx="8" fill="var(--new)"/>
  <text x="414" y="224" fill="var(--bg)" font-size="13.5" font-weight="800" text-anchor="middle">検出</text>
  <text x="414" y="240" fill="var(--bg)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">3F/4</text>
  <rect x="490" y="204" width="140" height="46" rx="8" fill="var(--new)"/>
  <text x="560" y="224" fill="var(--bg)" font-size="13.5" font-weight="800" text-anchor="middle">検出</text>
  <text x="560" y="240" fill="var(--bg)" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">2F/3</text>

  <line x1="14" y1="266" x2="626" y2="266" stroke="var(--track)" stroke-width="1.5"/>
  <text x="14" y="288" fill="var(--sub)" font-size="11.5">検出＝そのバグを入れたときテストが落ちた層。F＝失敗した件数、P＝全通過。</text>
