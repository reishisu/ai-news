<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <!-- 左: 全体カバレッジ -->
  <text x="14" y="24" fill="var(--sub)" font-size="12.5" font-weight="800">レビューに出しても動けない</text>
  <rect x="14" y="34" width="296" height="238" rx="10" fill="none" stroke="var(--sub)" stroke-width="1.2"/>

  <text x="30" y="60" fill="var(--fg)" font-size="14" font-weight="800">全体カバレッジ</text>
  <text x="30" y="79" fill="var(--sub)" font-size="11">分母はリポジトリ全体</text>

  <text x="30" y="104" fill="var(--sub)" font-size="11.5" font-family="ui-monospace, monospace">変更前 100.0%</text>
  <rect x="30" y="110" width="250" height="14" rx="4" fill="var(--old)"/>

  <text x="30" y="150" fill="var(--sub)" font-size="11.5" font-family="ui-monospace, monospace">変更後 92.9%</text>
  <rect x="30" y="156" width="250" height="14" rx="4" fill="var(--track)"/>
  <rect x="30" y="156" width="232" height="14" rx="4" fill="var(--old)"/>

  <text x="30" y="202" fill="var(--c)" font-size="15" font-weight="800">−7.1pt しか動かない</text>
  <text x="30" y="228" fill="var(--sub)" font-size="12">全体閾値のCIゲートでは</text>
  <text x="30" y="247" fill="var(--sub)" font-size="12">この変更を止められない</text>

  <!-- 右: 差分カバレッジ -->
  <text x="330" y="24" fill="var(--a)" font-size="12.5" font-weight="800">レビューに出すのはこっち</text>
  <rect x="330" y="34" width="296" height="238" rx="10" fill="none" stroke="var(--a)" stroke-width="2"/>

  <text x="346" y="60" fill="var(--fg)" font-size="14" font-weight="800">差分カバレッジ</text>
  <text x="346" y="79" fill="var(--sub)" font-size="11">分母は追加した14行だけ</text>

  <text x="346" y="104" fill="var(--sub)" font-size="11.5" font-family="ui-monospace, monospace">71.4%（10行 / 14行）</text>
  <rect x="346" y="110" width="250" height="14" rx="4" fill="var(--track)"/>
  <rect x="346" y="110" width="178" height="14" rx="4" fill="var(--new)"/>
  <rect x="524" y="110" width="72" height="14" rx="4" fill="var(--c)"/>

  <text x="346" y="150" fill="var(--c)" font-size="12.5" font-weight="800">誰も通していない4行</text>
  <text x="346" y="172" fill="var(--fg)" font-size="10.5" font-family="ui-monospace, monospace">coupon.py:13 c = code.strip().upper()</text>
  <text x="346" y="190" fill="var(--fg)" font-size="10.5" font-family="ui-monospace, monospace">coupon.py:14 if c not in CODES:</text>
  <text x="346" y="208" fill="var(--fg)" font-size="10.5" font-family="ui-monospace, monospace">coupon.py:15 raise ValueError(...)</text>
  <text x="346" y="226" fill="var(--fg)" font-size="10.5" font-family="ui-monospace, monospace">coupon.py:16 return CODES[c]</text>

  <text x="346" y="252" fill="var(--a)" font-size="12">行を名指しできるので直せる</text>
</svg>
