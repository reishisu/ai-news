<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200">
  <text x="8" y="22" font-size="15" font-weight="700" fill="var(--fg)">パイプでつなぐと、成否の判定が入れ替わる</text>

  <rect x="8" y="42" width="300" height="140" rx="11" fill="var(--track)"/>
  <text x="24" y="68" font-size="13.5" font-weight="700" fill="var(--c)">やりがちな書き方</text>
  <text x="24" y="96" font-size="12.5" font-family="monospace" fill="var(--fg)">if pytest -q | tail -1; then</text>
  <text x="24" y="126" font-size="12.5" fill="var(--sub)">判定されるのは tail の成否</text>
  <text x="24" y="150" font-size="12.5" fill="var(--sub)">tail はいつも成功する</text>
  <text x="24" y="172" font-size="13" font-weight="700" fill="var(--c)">→ 失敗しても「成功」と誤判定</text>

  <rect x="332" y="42" width="300" height="140" rx="11" fill="var(--track)"/>
  <text x="348" y="68" font-size="13.5" font-weight="700" fill="var(--a)">正しい書き方</text>
  <text x="348" y="96" font-size="12.5" font-family="monospace" fill="var(--fg)">if pytest -q; then</text>
  <text x="348" y="126" font-size="12.5" fill="var(--sub)">判定されるのは pytest の成否</text>
  <text x="348" y="150" font-size="12.5" fill="var(--sub)">出力を削りたいなら別の行で</text>
  <text x="348" y="172" font-size="13" font-weight="700" fill="var(--a)">→ ループがちゃんと止まる</text>
</svg>
