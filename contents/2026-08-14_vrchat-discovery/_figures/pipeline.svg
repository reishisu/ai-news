<svg viewBox="0 0 640 250" xmlns="http://www.w3.org/2000/svg" role="img">
  <defs>
    <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="var(--sub)"/>
    </marker>
  </defs>

  <!-- 3段階 -->
  <rect x="14" y="60" width="176" height="70" rx="10" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="102" y="88" fill="var(--fg)" font-size="14" font-weight="800" text-anchor="middle">Private</text>
  <text x="102" y="110" fill="var(--sub)" font-size="11.5" text-anchor="middle">自分とリンクを知る人だけ</text>

  <path d="M196 95 L226 95" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#p1)"/>

  <rect x="232" y="60" width="176" height="70" rx="10" fill="var(--track)" stroke="var(--d)" stroke-width="2"/>
  <text x="320" y="88" fill="var(--fg)" font-size="14" font-weight="800" text-anchor="middle">Community Labs</text>
  <text x="320" y="110" fill="var(--sub)" font-size="11.5" text-anchor="middle">探せば見つかる。Worlds には出ない</text>

  <path d="M414 95 L444 95" stroke="var(--sub)" stroke-width="1.8" marker-end="url(#p1)"/>

  <rect x="450" y="60" width="176" height="70" rx="10" fill="var(--track)" stroke="var(--a)" stroke-width="2"/>
  <text x="538" y="88" fill="var(--fg)" font-size="14" font-weight="800" text-anchor="middle">Public</text>
  <text x="538" y="110" fill="var(--sub)" font-size="11.5" text-anchor="middle">Worlds ページに載る</text>

  <!-- ゲート -->
  <text x="211" y="40" fill="var(--d)" font-size="12" font-weight="800" text-anchor="middle">自分で押す</text>
  <text x="211" y="164" fill="var(--sub)" font-size="11.5" text-anchor="middle">週1本まで</text>
  <text x="211" y="182" fill="var(--sub)" font-size="11.5" text-anchor="middle">Trust Rank「User」以上</text>

  <text x="429" y="40" fill="var(--a)" font-size="12" font-weight="800" text-anchor="middle">自動で上がる</text>
  <text x="429" y="164" fill="var(--sub)" font-size="11.5" text-anchor="middle">期間の定めなし</text>
  <text x="429" y="182" fill="var(--sub)" font-size="11.5" text-anchor="middle">楽しまれているかで判定</text>

  <!-- 注意 -->
  <rect x="14" y="200" width="612" height="40" rx="9" fill="none" stroke="var(--c)" stroke-width="2"/>
  <text x="320" y="225" fill="var(--c)" font-size="12.5" font-weight="800" text-anchor="middle">Labs の行は、プレイヤーが設定で表示をオンにしていないと見えない</text>
</svg>
