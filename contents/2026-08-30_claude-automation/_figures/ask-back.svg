<svg viewBox="0 0 460 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <text x="14" y="28" font-size="24" font-weight="700" fill="var(--fg)">同じ命令を3回。記録が揃わない</text>
  <text x="128" y="58" font-size="16" font-weight="700" fill="var(--sub)" text-anchor="middle">denials</text>
  <text x="330" y="58" font-size="16" font-weight="700" fill="var(--sub)" text-anchor="middle">f.txt</text>
  <g data-step="1">
    <rect x="14" y="68" width="432" height="46" rx="8" fill="var(--c)" opacity="0.24"/>
    <text x="30" y="98" font-size="18" fill="var(--fg)">1回目</text>
    <text x="128" y="98" font-size="22" font-weight="700" fill="var(--c)" text-anchor="middle">0</text>
    <text x="330" y="98" font-size="18" font-weight="700" fill="var(--fg)" text-anchor="middle">のこる</text>
  </g>
  <g data-step="2">
    <rect x="14" y="120" width="432" height="46" rx="8" fill="var(--track)"/>
    <text x="30" y="150" font-size="18" fill="var(--sub)">2回目</text>
    <text x="128" y="150" font-size="22" font-weight="700" fill="var(--sub)" text-anchor="middle">2</text>
    <text x="330" y="150" font-size="18" font-weight="700" fill="var(--sub)" text-anchor="middle">のこる</text>
  </g>
  <g data-step="3">
    <rect x="14" y="172" width="432" height="46" rx="8" fill="var(--c)" opacity="0.24"/>
    <text x="30" y="202" font-size="18" fill="var(--fg)">3回目</text>
    <text x="128" y="202" font-size="22" font-weight="700" fill="var(--c)" text-anchor="middle">0</text>
    <text x="330" y="202" font-size="18" font-weight="700" fill="var(--fg)" text-anchor="middle">のこる</text>
  </g>
  <g data-step="4">
    <rect x="14" y="234" width="432" height="72" rx="10" fill="var(--c)" opacity="0.24"/>
    <text x="30" y="264" font-size="20" font-weight="700" fill="var(--c)">記録は消えても</text>
    <text x="30" y="292" font-size="20" font-weight="700" fill="var(--c)">やっていない事実は同じ</text>
  </g>
</svg>
