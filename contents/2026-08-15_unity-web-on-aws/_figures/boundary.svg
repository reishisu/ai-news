<svg viewBox="0 0 640 308" xmlns="http://www.w3.org/2000/svg" role="img">

  <text x="320" y="24" fill="var(--sub)" font-size="12" font-weight="700" text-anchor="middle">境界：ビルド成果物の受け渡し</text>

  <!-- divider -->
  <line x1="320" y1="34" x2="320" y2="278" stroke="var(--sub)" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- 左: 自社 -->
  <rect x="14" y="40" width="286" height="238" rx="12" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="32" y="66" fill="var(--b)" font-size="13.5" font-weight="800">自社（クライアント側）</text>
  <text x="32" y="86" fill="var(--sub)" font-size="11">自分で直せる範囲</text>
  <line x1="32" y1="98" x2="282" y2="98" stroke="var(--sub)" stroke-width="1" opacity="0.4"/>

  <circle cx="36" cy="120" r="3" fill="var(--b)"/>
  <text x="48" y="124" fill="var(--fg)" font-size="12.5" font-weight="700">マルチスレッドON/OFFの判断</text>
  <text x="48" y="140" fill="var(--sub)" font-size="11">公式は無効推奨。合意を先に取る</text>

  <circle cx="36" cy="164" r="3" fill="var(--b)"/>
  <text x="48" y="168" fill="var(--fg)" font-size="12.5" font-weight="700">ビルド成果物の作成</text>
  <text x="48" y="184" fill="var(--sub)" font-size="11">.wasm / .data / .js と拡張子まで</text>

  <circle cx="36" cy="208" r="3" fill="var(--b)"/>
  <text x="48" y="212" fill="var(--fg)" font-size="12.5" font-weight="700">外部ドメイン素材の洗い出し</text>
  <text x="48" y="228" fill="var(--sub)" font-size="11">COEPで落ちる。相手は知らない</text>

  <circle cx="36" cy="252" r="3" fill="var(--b)"/>
  <text x="48" y="256" fill="var(--fg)" font-size="12.5" font-weight="700" font-family="ui-monospace, monospace">crossOriginIsolated</text>
  <text x="48" y="272" fill="var(--sub)" font-size="11">ブラウザ側でしか確認できない</text>

  <!-- 右: インフラ会社 -->
  <rect x="340" y="40" width="286" height="238" rx="12" fill="var(--track)" stroke="var(--sub)" stroke-width="1"/>
  <text x="358" y="66" fill="var(--c)" font-size="13.5" font-weight="800">インフラ会社（AWS側）</text>
  <text x="358" y="86" fill="var(--sub)" font-size="11">依頼しないと1文字も動かせない</text>
  <line x1="358" y1="98" x2="608" y2="98" stroke="var(--sub)" stroke-width="1" opacity="0.4"/>

  <circle cx="362" cy="120" r="3" fill="var(--c)"/>
  <text x="374" y="124" fill="var(--fg)" font-size="12.5" font-weight="700">COOP / COEP / CORP を返す</text>
  <text x="374" y="140" fill="var(--sub)" font-size="11">CloudFront のカスタムヘッダー</text>

  <circle cx="362" cy="164" r="3" fill="var(--c)"/>
  <text x="374" y="168" fill="var(--fg)" font-size="12.5" font-weight="700">Content-Type / Encoding</text>
  <text x="374" y="184" fill="var(--sub)" font-size="11">S3のメタデータ設定</text>

  <circle cx="362" cy="208" r="3" fill="var(--c)"/>
  <text x="374" y="212" fill="var(--fg)" font-size="12.5" font-weight="700">ポリシーをビヘイビアに紐づけ</text>
  <text x="374" y="228" fill="var(--sub)" font-size="11">作っただけでは効かない</text>

  <circle cx="362" cy="252" r="3" fill="var(--c)"/>
  <text x="374" y="256" fill="var(--fg)" font-size="12.5" font-weight="700">HTTPS化（検証環境も含む）</text>
  <text x="374" y="272" fill="var(--sub)" font-size="11">平文HTTPだとCOOPは無視される</text>

  <text x="320" y="298" fill="var(--fg)" font-size="12.5" text-anchor="middle">右の列は、ビルドし直しても1ミリも変わらない</text>
</svg>
