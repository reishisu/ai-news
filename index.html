<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIニュース デイリーダイジェスト</title>
<meta name="description" content="世界のAIニュースを日本語で、毎朝6:00にお届けするデイリーダイジェスト">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="AIニュース デイリーダイジェスト">
<meta property="og:description" content="世界のAIニュースを日本語で、毎朝6:00にお届け">
<meta property="og:url" content="https://reishisu.github.io/ai-news/">
<meta property="og:image" content="https://reishisu.github.io/ai-news/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root {
    --bg: #f4f6fb;
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(255, 255, 255, 0.9);
    --text: #101418;
    --muted: #5a6472;
    --accent: #2a78d6;
    --accent2: #7c3aed;
    --chip-bg: rgba(42, 120, 214, 0.10);
    --shadow: 0 24px 60px -24px rgba(23, 43, 88, 0.35);
    --btn-bg: rgba(255, 255, 255, 0.85);
    --btn-border: rgba(16, 20, 24, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1020;
      --card: rgba(23, 29, 49, 0.66);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f2f5fa;
      --muted: #a8b3c4;
      --accent: #5aa2f0;
      --accent2: #a78bfa;
      --chip-bg: rgba(90, 162, 240, 0.14);
      --shadow: 0 24px 60px -20px rgba(0, 0, 0, 0.65);
      --btn-bg: rgba(30, 38, 63, 0.85);
      --btn-border: rgba(255, 255, 255, 0.14);
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }
  /* animated gradient blobs */
  .blob {
    position: fixed; border-radius: 50%; filter: blur(80px);
    opacity: .5; pointer-events: none; z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .b1 { width: 46vmax; height: 46vmax; background: #4f9cf0; top: -18vmax; left: -14vmax; }
  .b2 { width: 40vmax; height: 40vmax; background: #8b5cf6; bottom: -16vmax; right: -12vmax; animation-delay: -6s; }
  .b3 { width: 26vmax; height: 26vmax; background: #14b8a6; bottom: -8vmax; left: 22vmax; opacity: .3; animation-delay: -12s; }
  @media (prefers-color-scheme: dark) {
    .blob { opacity: .32; }
    .b3 { opacity: .18; }
  }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(6vmax, -4vmax) scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .blob, .card, .icon { animation: none !important; }
  }

  .card {
    position: relative; z-index: 1;
    width: min(640px, 100%);
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 48px 40px 40px;
    text-align: center;
    animation: rise .7s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(22px) scale(.98); }
    to   { opacity: 1; transform: none; }
  }
  .icon {
    width: 84px; height: 84px; margin: 0 auto 20px; display: block;
    filter: drop-shadow(0 10px 22px rgba(42, 120, 214, .45));
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  h1 {
    font-size: clamp(1.5rem, 4.6vw, 2.1rem);
    font-weight: 800; letter-spacing: .01em; line-height: 1.35;
  }
  h1 .grad {
    background: linear-gradient(92deg, var(--accent), var(--text) 45%, var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lead { margin-top: 14px; color: var(--muted); line-height: 1.9; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    margin-top: 22px; padding: 9px 20px; border-radius: 999px;
    background: var(--chip-bg); color: var(--accent);
    font-weight: 700; font-size: .92em;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: .45; }
  }

  /* countdown */
  .count { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  .cell {
    min-width: 86px; padding: 14px 10px 12px; border-radius: 16px;
    background: var(--btn-bg); border: 1px solid var(--btn-border);
  }
  .cell b { display: block; font-size: 1.9em; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .cell span { display: block; margin-top: 2px; font-size: .74em; color: var(--muted); font-weight: 600; }

  /* share */
  .share { margin-top: 32px; padding-top: 26px; border-top: 1px solid var(--btn-border); }
  .share p { font-size: .85em; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
  .share-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .sbtn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-radius: 12px; cursor: pointer;
    background: var(--btn-bg); border: 1px solid var(--btn-border);
    color: var(--text); font: inherit; font-size: .88em; font-weight: 600;
    text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .sbtn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -12px rgba(23, 43, 88, .5); }
  .sbtn:active { transform: translateY(0); }
  .sbtn svg { width: 17px; height: 17px; flex: none; }

  footer { margin-top: 26px; font-size: .78em; color: var(--muted); }

  @media (max-width: 600px) {
    body { font-size: 15px; padding: 16px; }
    .card { padding: 36px 22px 30px; }
    .count { gap: 8px; }
    .cell { min-width: 72px; }
  }
</style>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

  <main class="card">
    <img class="icon" src="favicon.svg" alt="" width="84" height="84">
    <h1>📰 <span class="grad">AIニュース デイリーダイジェスト</span></h1>
    <p class="lead">世界のAIニュースを日本語のビジュアルダイジェストでお届けします。<br>明日の朝6:00から毎日自動更新されます。</p>
    <span class="chip"><span class="dot"></span>毎朝 6:00 JST 自動更新</span>

    <div class="count" id="count" hidden>
      <div class="cell"><b id="ch">--</b><span>時間</span></div>
      <div class="cell"><b id="cm">--</b><span>分</span></div>
      <div class="cell"><b id="cs">--</b><span>秒</span></div>
    </div>
    <p class="lead" style="margin-top:10px;font-size:.82em;" id="countlabel" hidden>次回の更新まで</p>

    <div class="share">
      <p>🔗 このサイトをシェア</p>
      <div class="share-row" id="shareRow">
        <a class="sbtn" id="sh-x" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.41l-5.8-7.58-6.64 7.58H.47l8.6-9.83L0 1.15h7.59l5.24 6.93 6.07-6.93Zm-1.29 19.5h2.04L6.49 3.24H4.3l13.31 17.41Z"/></svg>
          X で共有
        </a>
        <a class="sbtn" id="sh-line" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="#06C755"><path d="M12 2C6.48 2 2 5.64 2 10.12c0 4.02 3.57 7.39 8.39 8.03.33.07.77.22.89.5.1.26.07.66.03.92l-.14.86c-.04.26-.2 1 .88.55 1.08-.46 5.8-3.42 7.92-5.85C21.53 13.55 22 11.92 22 10.12 22 5.64 17.52 2 12 2Z"/></svg>
          LINE で送る
        </a>
        <a class="sbtn" id="sh-fb" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8V24C19.61 23.09 24 18.1 24 12.07Z"/></svg>
          Facebook
        </a>
        <a class="sbtn" id="sh-hatena" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="#00A4DE"><path d="M20.47 0H3.53A3.53 3.53 0 0 0 0 3.53v16.94A3.53 3.53 0 0 0 3.53 24h16.94A3.53 3.53 0 0 0 24 20.47V3.53A3.53 3.53 0 0 0 20.47 0ZM12.1 17.1c-.9.99-2.28 1.2-3.36 1.2H5.18V5.72h3.4c1.09 0 2.32.13 3.13 1 .65.7.77 1.51.77 2.19 0 .84-.34 1.64-1.11 2.13 1.02.42 1.62 1.4 1.62 2.66 0 .96-.28 2.4-.9 3.4Zm5.32 1.2a1.53 1.53 0 1 1 0-3.06 1.53 1.53 0 0 1 0 3.06Zm1.24-4.3h-2.48V5.72h2.48V14Z"/></svg>
          はてブ
        </a>
        <button class="sbtn" id="sh-copy" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          <span id="copyLabel">リンクをコピー</span>
        </button>
        <button class="sbtn" id="sh-native" type="button" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
          その他
        </button>
      </div>
    </div>

    <footer>© AIニュース デイリーダイジェスト</footer>
  </main>

<script>
(function () {
  var PAGE_URL = "https://reishisu.github.io/ai-news/";
  var TITLE = "AIニュース デイリーダイジェスト";
  var u = encodeURIComponent(PAGE_URL), t = encodeURIComponent(TITLE);

  document.getElementById("sh-x").href = "https://twitter.com/intent/tweet?text=" + t + "&url=" + u;
  document.getElementById("sh-line").href = "https://social-plugins.line.me/lineit/share?url=" + u;
  document.getElementById("sh-fb").href = "https://www.facebook.com/sharer/sharer.php?u=" + u;
  document.getElementById("sh-hatena").href = "https://b.hatena.ne.jp/entry/panel/?url=" + u + "&btitle=" + t;

  document.getElementById("sh-copy").addEventListener("click", function () {
    var label = document.getElementById("copyLabel");
    (navigator.clipboard ? navigator.clipboard.writeText(PAGE_URL) : Promise.reject())
      .then(function () { label.textContent = "コピーしました ✓"; })
      .catch(function () { window.prompt("このURLをコピーしてください", PAGE_URL); })
      .finally(function () { setTimeout(function () { label.textContent = "リンクをコピー"; }, 2000); });
  });

  var nativeBtn = document.getElementById("sh-native");
  if (navigator.share) {
    nativeBtn.hidden = false;
    nativeBtn.addEventListener("click", function () {
      navigator.share({ title: TITLE, url: PAGE_URL }).catch(function () {});
    });
  }

  // countdown to next 6:00 JST
  var count = document.getElementById("count");
  var label = document.getElementById("countlabel");
  var ch = document.getElementById("ch"), cm = document.getElementById("cm"), cs = document.getElementById("cs");
  function nextSixJST() {
    var now = new Date();
    var jstMs = now.getTime() + 9 * 3600000;
    var jst = new Date(jstMs);
    var target = Date.UTC(jst.getUTCFullYear(), jst.getUTCMonth(), jst.getUTCDate(), 6, 0, 0);
    if (jstMs >= target) target += 86400000;
    return target - jstMs;
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var ms = nextSixJST();
    ch.textContent = pad(Math.floor(ms / 3600000));
    cm.textContent = pad(Math.floor(ms / 60000) % 60);
    cs.textContent = pad(Math.floor(ms / 1000) % 60);
  }
  count.hidden = false; label.hidden = false;
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
