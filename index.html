<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIニュース デイリーダイジェスト</title>
<style>
  :root {
    --bg: #f9f9f7;
    --card: #fcfcfb;
    --text: #0b0b0b;
    --muted: #52514e;
    --border: rgba(11, 11, 11, 0.10);
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0d0d;
      --card: #1a1a19;
      --text: #ffffff;
      --muted: #c3c2b7;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    border-radius: 14px;
    padding: 40px 32px;
    max-width: 560px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.5em;
    margin: 0 0 16px;
    line-height: 1.4;
  }
  p {
    color: var(--muted);
    margin: 0;
    line-height: 1.8;
  }
  @media (max-width: 600px) {
    body { font-size: 15px; padding: 16px; }
    .card { padding: 28px 20px; }
  }
</style>
</head>
<body>
  <main class="card">
    <h1>📰 AIニュース デイリーダイジェスト</h1>
    <p>明日の朝6:00から毎日自動更新されます</p>
  </main>
</body>
</html>
